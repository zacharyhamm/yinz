[package]
name = "yinz-terminal-graphics"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Kitty graphics and Sixel protocol engine for Yinz's terminal emulator"

[lints]
workspace = true

# Nothing from the terminal emulator itself: the grid drives this crate through `KittyGrid`,
# `SixelGrid` and their stores, never the other way round.
[dependencies]
yinz-types = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
libc = { workspace = true }
png = { version = "0.17.16", default-features = false }
sixel-image = { version = "0.2.1", default-features = false }
sixel-tokenizer = { version = "0.1.0", default-features = false }
# The file-transmission fixtures in `kitty_graphics::test_support`.
tempfile = { workspace = true }

[dev-dependencies]
hegeltest = "0.29.3"
vte = { workspace = true }
