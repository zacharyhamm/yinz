[package]
name = "zellij-bus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The zellij server's thread bus: instruction enums, senders, and the OS boundary's contract"

[lints]
workspace = true

[dependencies]
zellij-config = { workspace = true }
zellij-ipc = { workspace = true }
zellij-session = { workspace = true }
zellij-storage = { workspace = true }
zellij-runtime = { workspace = true }
zellij-types = { workspace = true }
zellij-host-protocol = { workspace = true }
zellij-process = { path = "../zellij-process", version = "0.45.0" }
ansi_term = { workspace = true }
anyhow = { workspace = true }
async-trait = { version = "0.1.50", default-features = false }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
futures-lite = { workspace = true }
interprocess = { workspace = true }
isahc = { workspace = true }
log = { workspace = true }
once_cell = "1.19"
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
hegeltest = "0.29.3"
rusqlite = { version = "0.30", default-features = false, features = ["bundled"] }
tempfile = "3.2.0"
tokio = { workspace = true, features = ["test-util"] }
zellij-test-support = { path = "../zellij-test-support" }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
