[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

[[profile.default.overrides]]
filter = 'binary(nested_fullscreen) + binary(nested_sessions) + binary(nested_hardening) + binary(nested_guest_modal) + binary(nested_status_hints) + binary(startup_host_query)'
threads-required = 4

# `cargo x test` - the unit and plugin suites, not the whole-app integration tests.
#
# Kept separate from `default` on purpose: the integration overrides above are keyed on binary
# names that mean nothing here, and the unit suites want a different timeout. `terminate-after`
# leaves room for the three 5s sleepers in `plugin_tests` on a loaded machine, while still
# killing a genuinely hung test well inside the 60s `default_timeout()` those tests wait on.
[profile.unit]
fail-fast = false
slow-timeout = { period = "15s", terminate-after = 4 }

# Opt-in real service test deliberately queues longer than the 90s dispatch timeout.
[[profile.unit.overrides]]
filter = 'package(zellij-swamp) & test(=refresh_tests::refreshes_local_extensions_once_after_active_work_and_preserves_suspension)'
slow-timeout = { period = "60s", terminate-after = 3 }

# Bootstrap holds the shared schema advisory lock; its deliberate stall must not time out
# other Postgres tests that are bootstrapping at the same time.
[[profile.unit.overrides]]
filter = 'test(=plugin_data_store::postgres::deadline_tests::blocked_bootstrap_and_query_discard_connections_and_reconnect)'
threads-required = "num-cpus"
