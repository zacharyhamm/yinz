[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
fail-fast = false

# This latency gate offers 100 hooks/s for 30 seconds; competing tests invalidate the measurement.
[[profile.default.overrides]]
filter = 'test(=runner::agents_hook_traffic::agents_panel_keeps_p95_below_100ms_at_100_hooks_per_second)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 2 }

# This test runs all builtin Scheme integration cases sequentially, including
# the real Git cleanup fixtures. Run it alone to avoid competing session and disk workloads.
# Each case also retains its own runner timeout.
[[profile.default.overrides]]
filter = 'binary(plugin_testing) & test(=installed_builtin_scheme_integration_suites)'
threads-required = "num-test-threads"
slow-timeout = { period = "60s", terminate-after = 3 }

[[profile.default.overrides]]
filter = 'binary(nested_fullscreen) + binary(nested_sessions) + binary(nested_hardening) + binary(nested_guest_modal) + binary(nested_status_hints) + binary(startup_host_query)'
threads-required = 4

# `cargo x test` - the unit and plugin suites, not the whole-app integration tests.
#
# Kept separate from `default` on purpose: the integration overrides above are keyed on binary
# names that mean nothing here, and the unit suites want a different timeout. `terminate-after`
# leaves room for the three 5s sleepers in `plugin_tests` on a loaded machine. The 45s
# `yinz_test_support::default_timeout()` those tests wait on ends before this 60s kill, so a
# stuck wait panics with what it saw (`yinz-test-support/src/unit/default_timeout.rs`).
[profile.unit]
fail-fast = false
slow-timeout = { period = "15s", terminate-after = 4 }

# These subprocesses exercise the production one-second hook deadline.
# Competing tests can exhaust it during reporting or delay parent wall-clock observations.
[[profile.unit.overrides]]
filter = '(package(yinz-muse) & test(=tests::reports_reach_the_bound_pane_and_nothing_else)) | (package(yinz-codex) & (test(=tests::routed_hook_traces_finish_for_success_unbound_and_errors) | test(=tests::routed_native_hooks_preserve_small_payloads_and_bound_large_ones))) | (binary(agent_report) & (test(=reporter_requires_its_exact_acceptance_and_bounds_stalled_peers) | test(=reporter_bounds_unclosed_stdin_even_when_diagnostics_cannot_be_written) | test(=codex_router_bounds_unclosed_stdin_without_configuration_or_logging) | test(=installed_scripts_keep_neutral_output_after_reporter_failure)))'
threads-required = "num-test-threads"

# These parity tests replay 8,784 and 8,976 terminal renders, respectively.
[[profile.unit.overrides]]
filter = 'test(=plugin_tests::compact_bar::compact_bar_wasm_deno_markers_nested_hints_and_themes) | test(=plugin_tests::tab_bar::tab_bar_wasm_deno_mouse_ranges_and_breadcrumbs)'
slow-timeout = { period = "60s", terminate-after = 3 }

# Text/JSON parity checks every target spelling through separate strict compiler workers.
[[profile.unit.overrides]]
filter = 'binary(portable_cli) & test(=plugin_check_targets_have_text_json_parity)'
slow-timeout = { period = "60s", terminate-after = 3 }
