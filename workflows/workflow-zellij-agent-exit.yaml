{
  "id": "76a1fdc0-9f59-4108-9d62-64ef3c8289d0",
  "name": "@hammz/zellij-agent-exit",
  "version": 1,
  "description": "Project-owned local agent work. Unknown operations are reconciled, never repeated.",
  "inputs": {
    "type": "object",
    "properties": {
      "launch": {
        "type": "string"
      },
      "session": {
        "type": "string"
      },
      "checkout": {
        "type": "string"
      },
      "target": {
        "type": "string"
      },
      "targetBranch": {
        "type": "string",
        "default": "main"
      },
      "gate": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "default": [
          "cargo",
          "x",
          "ci",
          "check"
        ]
      },
      "task": {
        "type": "string",
        "default": "Inspect and complete the existing work in this checkout. Do not merge, remove resources, or contact remotes. Leave changes for the workflow to commit. Report completion explicitly."
      },
      "kind": {
        "type": "string",
        "default": "codex"
      },
      "answer": {
        "type": "string",
        "default": ""
      },
      "submission": {
        "type": "string",
        "default": ""
      },
      "binary": {
        "type": "string",
        "default": "zellij"
      },
      "agentCommand": {
        "type": "string",
        "default": ""
      },
      "agentArgs": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "default": []
      },
      "firecracker": {
        "type": "string",
        "default": ""
      },
      "firecrackerImage": {
        "type": "string",
        "default": ""
      }
    },
    "required": [
      "launch",
      "session",
      "checkout",
      "target"
    ]
  },
  "jobs": [
    {
      "name": "main",
      "steps": [
        {
          "name": "attach",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-attachments\" }}",
            "methodName": "workflow_attach",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ \"attach-\" + run.id }}",
              "run": "${{ run.id }}",
              "workflow": "${{ run.workflowName }}"
            }
          }
        },
        {
          "name": "agent-work",
          "task": {
            "type": "workflow",
            "workflowIdOrName": "@hammz/zellij-agent-work",
            "inputs": {
              "launch": "${{ inputs.launch }}",
              "session": "${{ inputs.session }}",
              "checkout": "${{ inputs.checkout }}",
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "task": "${{ inputs.task }}",
              "kind": "${{ inputs.kind }}",
              "answer": "${{ inputs.answer }}",
              "submission": "${{ inputs.submission }}",
              "binary": "${{ inputs.binary }}",
              "agentCommand": "${{ inputs.agentCommand }}",
              "agentArgs": "${{ inputs.agentArgs }}",
              "firecracker": "${{ inputs.firecracker }}",
              "firecrackerImage": "${{ inputs.firecrackerImage }}"
            }
          },
          "dependsOn": [
            {
              "step": "attach",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        },
        {
          "name": "review-integration",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-continuation\" }}",
            "methodName": "continue_review",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "initial-review",
              "inputs": {
                "launch": "${{ inputs.launch }}",
                "session": "${{ inputs.session }}",
                "checkout": "${{ inputs.checkout }}",
                "target": "${{ inputs.target }}",
                "targetBranch": "${{ inputs.targetBranch }}",
                "gate": "${{ inputs.gate }}",
                "task": "${{ inputs.task }}",
                "kind": "${{ inputs.kind }}",
                "binary": "${{ inputs.binary }}",
                "agentCommand": "${{ inputs.agentCommand }}",
                "agentArgs": "${{ inputs.agentArgs }}",
                "firecracker": "${{ inputs.firecracker }}",
                "firecrackerImage": "${{ inputs.firecrackerImage }}",
                "cycle": "initial"
              }
            }
          },
          "dependsOn": [
            {
              "step": "agent-work",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        }
      ]
    }
  ],
  "reports": {
    "require": [
      "@hammz/workflow"
    ]
  }
}
