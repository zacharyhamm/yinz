---
id: 76a1fdc0-9f59-4108-9d62-64ef3c8289d0
name: "@hammz/zellij-agent-exit"
version: 1
description: User-driven agent exit decisions. Every continuation has a fresh run identity; no agent starts without a choice.
inputs:
  type: object
  properties:
    launch:
      type: string
    session:
      type: string
    checkout:
      type: string
    target:
      type: string
    targetBranch:
      type: string
      default: main
    gate:
      type: array
      items:
        type: string
      default:
      - cargo
      - x
      - ci
      - check
    kind:
      type: string
      default: ''
    answer:
      type: string
      default: ''
    submission:
      type: string
      default: ''
    binary:
      type: string
      default: zellij
    agentCommand:
      type: string
      default: ''
    agentArgs:
      type: array
      items:
        type: string
      default: []
    firecracker:
      type: string
      default: ''
    firecrackerImage:
      type: string
      default: ''
    sourcePane:
      type: integer
      minimum: -1
      default: -1
    phase:
      type: string
      default: prepare
      enum:
      - prepare
      - diff
      - commit
      - conflict
      - resolve
      - resolved
      - review
      - tests
      - failed-tests
      - fix
      - review-agent
      - confirm
      - cleanup
    state:
      type: object
      default:
        vmSync:
        evidence:
        review:
        test:
      additionalProperties: true
    flowVersion:
      type: integer
      default: 2
  required:
  - launch
  - session
  - checkout
  - target
jobs:
- name: main
  steps:
  - name: flow-version
    task:
      type: assert
      expr: has(inputs.flowVersion) && inputs.flowVersion == 2
      message: This suspended run predates the user-driven flow. Preserve it and start a fresh run.
      severity: high
  - name: attach
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-attach" }}
      methodName: workflow_attach
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-attach" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
    dependsOn:
    - step: flow-version
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: exit-question
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: open
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
        question: exit
        step: exit-approval
        kind: choice
        prompt: '${{ inputs.sourcePane >= 0 ? "Agent exited. Choose Restart, Fork, Begin review, or Leave." : "Choose Begin review or Leave." }}'
        answers: '${{ inputs.sourcePane >= 0 ? ["restart", "fork", "begin-review", "leave"] : ["begin-review", "leave"] }}'
        resumeInput: answer
    dependsOn:
    - step: attach
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: exit-approval
    task:
      type: manual_approval
      prompt: '${{ inputs.sourcePane >= 0 ? "Agent exited. Choose Restart, Fork, Begin review, or Leave." : "Choose Begin review or Leave." }}'
    dependsOn:
    - step: exit-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: exit-answer
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: consume
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        question: exit
        answer: "${{ inputs.answer }}"
        submission: "${{ inputs.submission }}"
    dependsOn:
    - step: exit-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: pane-choice
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-pane-choice" }}
      methodName: pane_action
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-pane-choice" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        action: "${{ inputs.answer }}"
    dependsOn:
    - step: exit-answer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.answer != "begin-review") }}
  - name: picker-result
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-picker-result" }}
      methodName: observe
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-pane-choice" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
    dependsOn:
    - step: pane-choice
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.answer in ["fork", "duplicate"]) }}
  - name: picker-cancelled
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-picker-cancelled" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-picker-cancelled" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-agent-exit"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: prepare
          state:
            vmSync:
            evidence:
            review:
            test:
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: picker-result
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.answer in ["fork", "duplicate"] && data.latest(run.id + "-picker-result", "operation-current").attributes.choice == "cancelled") }}
  - name: begin-review
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-begin-review" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-begin-review" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: prepare
          state:
            vmSync:
            evidence:
            review:
            test:
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: picker-cancelled
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.answer == "begin-review") }}
reports:
  require:
  - "@hammz/workflow"
