{
  "id": "d620470c-a0de-4d4f-b2bc-13bfac15d9c3",
  "name": "@hammz/yinz-question",
  "version": 1,
  "description": "Project-owned local agent work. Unknown operations are reconciled, never repeated.",
  "inputs": {
    "type": "object",
    "properties": {
      "launch": {
        "type": "string"
      },
      "session": {
        "type": "string"
      },
      "kind": {
        "type": "string",
        "default": "choice"
      },
      "prompt": {
        "type": "string"
      },
      "answers": {
        "type": "array",
        "items": {
          "type": "string"
        }
      },
      "answer": {
        "type": "string",
        "default": ""
      },
      "submission": {
        "type": "string",
        "default": ""
      },
      "binary": {
        "type": "string",
        "default": "yinz"
      },
      "agentCommand": {
        "type": "string",
        "default": ""
      },
      "agentArgs": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "default": []
      }
    },
    "required": [
      "launch",
      "session",
      "prompt",
      "answers"
    ]
  },
  "jobs": [
    {
      "name": "main",
      "steps": [
        {
          "name": "attach",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/yinz",
            "modelName": "${{ inputs.launch + \"-attachments\" }}",
            "methodName": "workflow_attach",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ \"attach-\" + run.id }}",
              "run": "${{ run.id }}",
              "workflow": "${{ run.workflowName }}"
            }
          }
        },
        {
          "name": "open",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/question",
            "modelName": "${{ inputs.launch + \"-questions-\" + run.id }}",
            "methodName": "open",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "run": "${{ run.id }}",
              "workflow": "${{ run.workflowName }}",
              "question": "question",
              "step": "approve",
              "kind": "${{ inputs.kind }}",
              "prompt": "${{ inputs.prompt }}",
              "answers": "${{ inputs.answers }}",
              "resumeInput": "answer"
            }
          },
          "dependsOn": [
            {
              "step": "attach",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        },
        {
          "name": "approve",
          "task": {
            "type": "manual_approval",
            "prompt": "${{ inputs.prompt }}"
          },
          "dependsOn": [
            {
              "step": "open",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        },
        {
          "name": "consume",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/question",
            "modelName": "${{ inputs.launch + \"-questions-\" + run.id }}",
            "methodName": "consume",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "run": "${{ run.id }}",
              "question": "question",
              "answer": "${{ inputs.answer }}",
              "submission": "${{ inputs.submission }}"
            }
          },
          "dependsOn": [
            {
              "step": "approve",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        }
      ]
    }
  ]
}
