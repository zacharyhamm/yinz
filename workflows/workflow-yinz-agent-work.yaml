{
  "id": "1e144a1e-6589-4e29-bc64-1d7988d22405",
  "name": "@hammz/yinz-agent-work",
  "version": 1,
  "description": "Project-owned local agent work. Unknown operations are reconciled, never repeated.",
  "inputs": {
    "type": "object",
    "properties": {
      "launch": {
        "type": "string"
      },
      "session": {
        "type": "string"
      },
      "checkout": {
        "type": "string"
      },
      "target": {
        "type": "string"
      },
      "targetBranch": {
        "type": "string",
        "default": "main"
      },
      "gate": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "default": [
          "cargo",
          "x",
          "ci",
          "check"
        ]
      },
      "task": {
        "type": "string",
        "default": "Inspect and complete the existing work in this checkout. Do not merge, remove resources, or contact remotes. Leave changes for the workflow to commit. Report completion explicitly."
      },
      "kind": {
        "type": "string",
        "default": "codex"
      },
      "answer": {
        "type": "string",
        "default": ""
      },
      "submission": {
        "type": "string",
        "default": ""
      },
      "binary": {
        "type": "string",
        "default": "yinz"
      },
      "agentCommand": {
        "type": "string",
        "default": ""
      },
      "agentArgs": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "default": []
      }
    },
    "required": [
      "launch",
      "session",
      "checkout",
      "target"
    ]
  },
  "jobs": [
    {
      "name": "main",
      "steps": [
        {
          "name": "attach",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/yinz",
            "modelName": "${{ inputs.launch + \"-attachments\" }}",
            "methodName": "workflow_attach",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ \"attach-\" + run.id }}",
              "run": "${{ run.id }}",
              "workflow": "${{ run.workflowName }}"
            }
          }
        },
        {
          "name": "spawn",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/yinz",
            "modelName": "${{ inputs.launch + \"-worker\" }}",
            "methodName": "agent_spawn",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "worker",
              "spec": {
                "kind": "${{ inputs.kind }}",
                "cwd": "${{ inputs.checkout }}",
                "source_directory": "${{ inputs.checkout }}",
                "command": "${{ inputs.agentCommand }}",
                "args": "${{ inputs.agentArgs }}"
              }
            }
          },
          "dependsOn": [
            {
              "step": "attach",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        },
        {
          "name": "prompt",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/yinz",
            "modelName": "${{ inputs.launch + \"-worker-turn\" }}",
            "methodName": "agent_prompt",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "initial-turn",
              "agent": "worker",
              "prompt": "${{ inputs.task }}"
            }
          },
          "dependsOn": [
            {
              "step": "spawn",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        },
        {
          "name": "completion",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/yinz",
            "modelName": "${{ inputs.launch + \"-worker-turn\" }}",
            "methodName": "observe",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "initial-turn",
              "timeoutSeconds": 3600
            }
          },
          "dependsOn": [
            {
              "step": "prompt",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        },
        {
          "name": "completed",
          "task": {
            "type": "assert",
            "expr": "data.latest(inputs.launch + \"-worker-turn\", \"operation-current\").attributes.outcome == \"completed\"",
            "message": "The work agent must explicitly complete; inspect unknown, failed, interrupted or process-exit outcomes.",
            "severity": "high"
          },
          "dependsOn": [
            {
              "step": "completion",
              "condition": {
                "type": "succeeded"
              }
            }
          ]
        }
      ]
    }
  ],
  "reports": {
    "require": [
      "@hammz/workflow"
    ]
  }
}
