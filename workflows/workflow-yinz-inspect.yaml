id: fc9ff3d1-4675-474d-8973-4acf74fbf31a
name: yinz-inspect
tags: {}
jobs:
  - name: main
    description: Capture the current Yinz session and verify that it has tabs
    steps:
      - name: inspect
        description: Read panes and tabs into Swamp data
        task:
          type: model_method
          modelIdOrName: yinz-session
          methodName: inspect
        dependsOn: []
        weight: 0
        allowFailure: false
      - name: verify-session
        task:
          type: assert
          expr: 'size(data.latest("yinz-session", "state").attributes.tabs) > 0'
          message: The Yinz session must have at least one tab
          severity: high
        dependsOn:
          - step: inspect
            condition:
              type: succeeded
    dependsOn: []
    weight: 0
version: 1
