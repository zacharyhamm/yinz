id: 76a1fdc0-9f59-4108-9d62-64ef3c8289d0
name: '@hammz/yinz-agent-exit'
description: Repeatable local validation. Every action is a developer choice; merge requires current passing checks.
version: 2
inputs:
  type: object
  properties:
    launch:
      type: string
    session:
      type: string
    checkout:
      type: string
    target:
      type: string
    targetBranch:
      type: string
      default: main
    gate:
      type: array
      default:
      - cargo
      - x
      - ci
      - check
      items:
        type: string
    kind:
      type: string
      default: ''
    answer:
      type: string
      default: ''
    submission:
      type: string
      default: ''
    binary:
      type: string
      default: yinz
    agentCommand:
      type: string
      default: ''
    commitAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    rebasePrompt:
      type: string
      default: 'Resolve only the current rebase conflicts in this checkout and stage each resolution. Do not run rebase --continue or --abort:
        the workflow owns continuation. Do not merge, remove resources, or contact remotes. Report the result and exit when done.'
      minLength: 1
      pattern: \S
    agentArgs:
      type: array
      default: []
      items:
        type: string
    firecracker:
      type: string
      default: ''
    firecrackerImage:
      type: string
      default: ''
    sourcePane:
      type: integer
      default: -1
      minimum: -1
    phase:
      type: string
      default: prepare
      enum:
      - prepare
      - diff
      - commit
      - resolve
      - continue
      - review-agent
      - review-fix
      - fix
      - tests
      - confirm
      - cleanup
    testReturn:
      type: object
      default:
        workflow: '@hammz/yinz-review-integration'
        phase: review
      properties:
        workflow:
          type: string
          enum:
          - '@hammz/yinz-agent-exit'
          - '@hammz/yinz-review-integration'
        phase:
          type: string
          enum:
          - prepare
          - conflict
          - resolved
          - review
          - confirm
      required:
      - workflow
      - phase
      additionalProperties: false
    state:
      type: object
      default:
        vmSync: null
        evidence: null
        review: null
        test: null
      additionalProperties: true
    flowVersion:
      type: integer
      default: 3
    reviewAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    reviewFixAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    rebaseAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    testFixAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
  required:
  - launch
  - session
  - checkout
  - target
reports:
  require:
  - '@hammz/workflow'
jobs:
- name: main
  steps:
  - name: flow-version
    task:
      type: assert
      expr: has(inputs.flowVersion) && inputs.flowVersion == 3
      message: This suspended decision uses an older flow. Preserve it and start a fresh launch.
      severity: high
  - name: attach
    task:
      type: model_method
      modelType: '@hammz/yinz'
      modelName: ${{ run.id + "-attach" }}
      methodName: workflow_attach
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-attach" }}
        run: ${{ run.id }}
        workflow: ${{ run.workflowName }}
    dependsOn:
    - step: flow-version
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: begin-review
    task:
      type: model_method
      modelType: '@hammz/yinz'
      modelName: ${{ run.id + "-begin-review" }}
      methodName: continue_flow
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-begin-review" }}
        workflow: '@hammz/yinz-review-integration'
        inputs:
          launch: ${{ inputs.launch }}
          session: ${{ inputs.session }}
          checkout: ${{ inputs.checkout }}
          target: ${{ inputs.target }}
          targetBranch: ${{ inputs.targetBranch }}
          gate: ${{ inputs.gate }}
          kind: ${{ inputs.kind }}
          binary: ${{ inputs.binary }}
          agentCommand: ${{ inputs.agentCommand }}
          agentArgs: ${{ inputs.agentArgs }}
          commitAgent: ${{ inputs.commitAgent }}
          reviewAgent: ${{ inputs.reviewAgent }}
          reviewFixAgent: ${{ inputs.reviewFixAgent }}
          rebaseAgent: ${{ inputs.rebaseAgent }}
          testFixAgent: ${{ inputs.testFixAgent }}
          rebasePrompt: ${{ inputs.rebasePrompt }}
          firecracker: ${{ inputs.firecracker }}
          firecrackerImage: ${{ inputs.firecrackerImage }}
          sourcePane: ${{ inputs.sourcePane }}
          flowVersion: ${{ inputs.flowVersion }}
          testReturn: ${{ inputs.testReturn }}
          phase: prepare
          state: ${{ inputs.state }}
    dependsOn:
    - step: attach
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
