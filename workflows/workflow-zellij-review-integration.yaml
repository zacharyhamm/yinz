{
  "id": "7fef23fb-ec77-4be5-a30f-2a5854bbbabd",
  "name": "@hammz/zellij-review-integration",
  "version": 1,
  "description": "Project-owned local agent work. Unknown operations are reconciled, never repeated.",
  "inputs": {
    "type": "object",
    "properties": {
      "launch": {
        "type": "string"
      },
      "session": {
        "type": "string"
      },
      "checkout": {
        "type": "string"
      },
      "target": {
        "type": "string"
      },
      "targetBranch": {
        "type": "string",
        "default": "main"
      },
      "gate": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "default": [
          "cargo",
          "x",
          "ci",
          "check"
        ]
      },
      "task": {
        "type": "string",
        "default": "Inspect and complete the existing work in this checkout. Do not merge, remove resources, or contact remotes. Leave changes for the workflow to commit. Report completion explicitly."
      },
      "kind": {
        "type": "string",
        "default": "codex"
      },
      "answer": {
        "type": "string",
        "default": ""
      },
      "submission": {
        "type": "string",
        "default": ""
      },
      "binary": {
        "type": "string",
        "default": "zellij"
      },
      "agentCommand": {
        "type": "string",
        "default": ""
      },
      "agentArgs": {
        "type": "array",
        "items": {
          "type": "string"
        },
        "default": []
      },
      "firecracker": {
        "type": "string",
        "default": ""
      },
      "firecrackerImage": {
        "type": "string",
        "default": ""
      },
      "cycle": {
        "type": "string",
        "default": "initial"
      }
    },
    "required": [
      "launch",
      "session",
      "checkout",
      "target"
    ]
  },
  "jobs": [
    {
      "name": "main",
      "steps": [
        {
          "name": "attach",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-attachments\" }}",
            "methodName": "workflow_attach",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ \"attach-\" + run.id }}",
              "run": "${{ run.id }}",
              "workflow": "${{ run.workflowName }}"
            }
          }
        },
        {
          "name": "round-0-sync",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-worker-sync\" }}",
            "methodName": "vm_sync",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-sync-0\" }}",
              "agent": "worker"
            }
          },
          "dependsOn": [
            {
              "step": "attach",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-synced",
          "task": {
            "type": "assert",
            "expr": "data.latest(inputs.launch + \"-worker-sync\", \"operation-current\").attributes.clean == true",
            "message": "Unresolved guest changes or sync conflicts block integration.",
            "severity": "high"
          },
          "dependsOn": [
            {
              "step": "round-0-sync",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-inspect",
          "task": {
            "type": "model_method",
            "modelType": "@swamp/git",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\" }}",
            "methodName": "verify_checkout",
            "globalArgs": {
              "repoPath": "${{ inputs.checkout }}"
            },
            "inputs": {
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "vmSync": "${{ data.latest(inputs.launch + \"-worker-sync\", \"operation-current\").attributes }}",
              "binary": "${{ inputs.binary }}",
              "source": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-synced",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-commit",
          "task": {
            "type": "model_method",
            "modelType": "@swamp/git",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\" }}",
            "methodName": "guarded_commit",
            "globalArgs": {
              "repoPath": "${{ inputs.checkout }}"
            },
            "inputs": {
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "vmSync": "${{ data.latest(inputs.launch + \"-worker-sync\", \"operation-current\").attributes }}",
              "key": "commit-0",
              "message": "Complete agent work (review round 0)",
              "binary": "${{ inputs.binary }}",
              "source": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-inspect",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.clean || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.rebasing }}"
        },
        {
          "name": "round-0-rebase",
          "task": {
            "type": "model_method",
            "modelType": "@swamp/git",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\" }}",
            "methodName": "rebase",
            "globalArgs": {
              "repoPath": "${{ inputs.checkout }}"
            },
            "inputs": {
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "vmSync": "${{ data.latest(inputs.launch + \"-worker-sync\", \"operation-current\").attributes }}",
              "key": "rebase-0",
              "binary": "${{ inputs.binary }}",
              "source": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-commit",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.rebasing }}"
        },
        {
          "name": "round-0-continue-rebase",
          "task": {
            "type": "model_method",
            "modelType": "@swamp/git",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\" }}",
            "methodName": "rebase_continue",
            "globalArgs": {
              "repoPath": "${{ inputs.checkout }}"
            },
            "inputs": {
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "vmSync": "${{ data.latest(inputs.launch + \"-worker-sync\", \"operation-current\").attributes }}",
              "key": "continue-0",
              "binary": "${{ inputs.binary }}",
              "source": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-rebase",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.rebasing }}"
        },
        {
          "name": "round-0-revision",
          "task": {
            "type": "model_method",
            "modelType": "@swamp/git",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\" }}",
            "methodName": "verify_checkout",
            "globalArgs": {
              "repoPath": "${{ inputs.checkout }}"
            },
            "inputs": {
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "vmSync": "${{ data.latest(inputs.launch + \"-worker-sync\", \"operation-current\").attributes }}",
              "binary": "${{ inputs.binary }}",
              "source": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-continue-rebase",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-review-spawn",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-reviewer\" }}",
            "methodName": "agent_spawn",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-reviewer-0\" }}",
              "spec": {
                "kind": "${{ inputs.kind }}",
                "cwd": "${{ inputs.checkout }}",
                "source_directory": "${{ inputs.checkout }}",
                "command": "${{ inputs.agentCommand }}",
                "args": "${{ inputs.agentArgs }}"
              }
            }
          },
          "dependsOn": [
            {
              "step": "round-0-revision",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-review",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-review\" }}",
            "methodName": "review_prompt",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-review-0\" }}",
              "agent": "${{ inputs.cycle + \"-reviewer-0\" }}",
              "evidence": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-review-spawn",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-review-completion",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-review\" }}",
            "methodName": "observe",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-review-0\" }}",
              "timeoutSeconds": 3600
            }
          },
          "dependsOn": [
            {
              "step": "round-0-review",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-review-findings",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-review\" }}",
            "methodName": "review_result",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "operation": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-review\", \"operation-current\").attributes }}",
              "evidence": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes }}",
              "worker": "worker"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-review-completion",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-gate",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-gate\" }}",
            "methodName": "command",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-gate-0\" }}",
              "argv": "${{ inputs.gate }}",
              "cwd": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-review-findings",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.rebasing || !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.clean }}"
        },
        {
          "name": "round-0-gate-completion",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-gate\" }}",
            "methodName": "observe",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-gate-0\" }}",
              "timeoutSeconds": 7200
            }
          },
          "dependsOn": [
            {
              "step": "round-0-gate",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.rebasing || !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.clean }}"
        },
        {
          "name": "round-0-gate-result",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-gate\" }}",
            "methodName": "test_result",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "operation": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-gate\", \"operation-current\").attributes }}",
              "evidence": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-gate-completion",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.rebasing || !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.clean }}"
        },
        {
          "name": "round-0-freshness",
          "task": {
            "type": "model_method",
            "modelType": "@swamp/git",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\" }}",
            "methodName": "verify_checkout",
            "globalArgs": {
              "repoPath": "${{ inputs.checkout }}"
            },
            "inputs": {
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "vmSync": "${{ data.latest(inputs.launch + \"-worker-sync\", \"operation-current\").attributes }}",
              "binary": "${{ inputs.binary }}",
              "source": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-gate-result",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-0-assess",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-assessment\" }}",
            "methodName": "assess",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "review": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-review\", \"review-current\").attributes }}",
              "test": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.rebasing || !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes.source.clean ? null : data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-gate\", \"test-current\").attributes }}",
              "current": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-round-0-git\", \"evidence-current\").attributes }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-freshness",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ]
        },
        {
          "name": "round-1-repair",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-worker-turn\" }}",
            "methodName": "repair_prompt",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-repair-1\" }}",
              "agent": "worker",
              "assessment": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes }}"
            }
          },
          "dependsOn": [
            {
              "step": "round-0-assess",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready == true }}"
        },
        {
          "name": "round-1-repair-completion",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-worker-turn\" }}",
            "methodName": "observe",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-repair-1\" }}",
              "timeoutSeconds": 3600
            }
          },
          "dependsOn": [
            {
              "step": "round-1-repair",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready == true }}"
        },
        {
          "name": "round-1-repair-completed",
          "task": {
            "type": "assert",
            "expr": "data.latest(inputs.launch + \"-worker-turn\", \"operation-current\").attributes.outcome == \"completed\"",
            "message": "Repair did not explicitly complete. Reconcile the operation.",
            "severity": "high"
          },
          "dependsOn": [
            {
              "step": "round-1-repair-completion",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready == true }}"
        },
        {
          "name": "round-1-sync",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-worker-sync\" }}",
            "methodName": "vm_sync",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-sync-1\" }}",
              "agent": "worker"
            }
          },
          "dependsOn": [
            {
              "step": "round-1-repair-completed",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready == true }}"
        },
        {
          "name": "round-1-synced",
          "task": {
            "type": "assert",
            "expr": "data.latest(inputs.launch + \"-worker-sync\", \"operation-current\").attributes.clean == true",
            "message": "Unresolved guest changes or sync conflicts block integration.",
            "severity": "high"
          },
          "dependsOn": [
            {
              "step": "round-1-sync",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
