        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-agent-exit"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: prepare
          state:
            vmSync:
            evidence:
            review:
            test:
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: reviewed-checkout
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !((inputs.phase in ["resolve", "fix", "review-agent"]) && (inputs.phase in ["resolve", "fix"] || data.latest(run.id + "-review-baseline", "evidence-current").attributes == inputs.state.evidence) && inputs.phase in ["review-agent"] && !(data.latest(run.id + "-reviewed-checkout", "evidence-current").attributes.source == inputs.state.evidence.source && data.latest(run.id + "-reviewed-checkout", "evidence-current").attributes.target == inputs.state.evidence.target)) }}
  - name: review-result
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-review-result" }}
      methodName: review_result
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        operation: ${{ data.latest(run.id + "-helper-exit", "operation-current").attributes }}
        evidence: "${{ inputs.state.evidence }}"
        worker: source
    dependsOn:
    - step: reviewer-changed
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !((inputs.phase in ["resolve", "fix", "review-agent"]) && (inputs.phase in ["resolve", "fix"] || data.latest(run.id + "-review-baseline", "evidence-current").attributes == inputs.state.evidence) && inputs.phase in ["review-agent"] && data.latest(run.id + "-reviewed-checkout", "evidence-current").attributes.source == inputs.state.evidence.source && data.latest(run.id + "-reviewed-checkout", "evidence-current").attributes.target == inputs.state.evidence.target) }}
  - name: reviewer-unchanged
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-reviewer-unchanged" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-reviewer-unchanged" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: confirm
          state:
            vmSync: "${{ inputs.state.vmSync }}"
            evidence: "${{ inputs.state.evidence }}"
            review: ${{ data.latest(run.id + "-review-result", "review-current").attributes }}
            test: "${{ inputs.state.test }}"
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: review-result
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !((inputs.phase in ["resolve", "fix", "review-agent"]) && (inputs.phase in ["resolve", "fix"] || data.latest(run.id + "-review-baseline", "evidence-current").attributes == inputs.state.evidence) && inputs.phase in ["review-agent"] && data.latest(run.id + "-reviewed-checkout", "evidence-current").attributes.source == inputs.state.evidence.source && data.latest(run.id + "-reviewed-checkout", "evidence-current").attributes.target == inputs.state.evidence.target) }}
  - name: checks
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-checks" }}
      methodName: check_status
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        evidence: "${{ inputs.state.evidence }}"
        review: "${{ inputs.state.review }}"
        test: "${{ inputs.state.test }}"
    dependsOn:
    - step: reviewer-unchanged
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["confirm"] && data.latest(run.id + "-inspect", "evidence-current").attributes == inputs.state.evidence) }}
  - name: merge-question
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: open
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
        question: merge
        step: merge-approval
        kind: merge
        prompt: '${{ inputs.phase == "confirm" ? ("Merge exact revision " + inputs.state.evidence.source.commit + " into local " + inputs.targetBranch + " at " + inputs.state.evidence.target.commit + "? Tests: " + (inputs.state.test == null ? "SKIPPED" : (inputs.state.test.passed ? "PASSED" : "FAILED (see saved output)")) + ". Review: " + (inputs.state.review == null ? "SKIPPED" : (inputs.state.review.resolved ? "PASSED" : "FAILED / unresolved findings (see saved review)")) + ". Merge explicitly accepts these check results. Run tests to check again. Leave preserves everything.") : "Inactive decision" }}'
        answers:
        - merge
        - run-tests
        - leave
        resumeInput: answer
    dependsOn:
    - step: checks
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["confirm"] && data.latest(run.id + "-inspect", "evidence-current").attributes == inputs.state.evidence) }}
  - name: merge-approval
    task:
      type: manual_approval
      prompt: '${{ (inputs.phase in ["confirm"] && data.latest(run.id + "-inspect", "evidence-current").attributes == inputs.state.evidence) ? (inputs.phase == "confirm" ? ("Merge exact revision " + inputs.state.evidence.source.commit + " into local " + inputs.targetBranch + " at " + inputs.state.evidence.target.commit + "? Tests: " + (inputs.state.test == null ? "SKIPPED" : (inputs.state.test.passed ? "PASSED" : "FAILED (see saved output)")) + ". Review: " + (inputs.state.review == null ? "SKIPPED" : (inputs.state.review.resolved ? "PASSED" : "FAILED / unresolved findings (see saved review)")) + ". Merge explicitly accepts these check results. Run tests to check again. Leave preserves everything.") : "Inactive decision") : "Inactive decision" }}'
    dependsOn:
    - step: merge-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["confirm"] && data.latest(run.id + "-inspect", "evidence-current").attributes == inputs.state.evidence) }}
  - name: merge-answer
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: consume
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        question: merge
        answer: "${{ inputs.answer }}"
        submission: "${{ inputs.submission }}"
    dependsOn:
    - step: merge-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["confirm"] && data.latest(run.id + "-inspect", "evidence-current").attributes == inputs.state.evidence) }}
  - name: menu-tests
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-menu-tests" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-menu-tests" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: tests
          state:
            vmSync: '${{ data.latest(run.id + "-inspect", "evidence-current").attributes.vmSync }}'
            evidence: '${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}'
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          testReturn: '${{ inputs.phase == "failed-tests" ? inputs.testReturn : {"workflow": run.workflowName, "phase": inputs.phase} }}'
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: merge-answer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare", "conflict", "resolved", "review", "failed-tests", "confirm"] && inputs.answer == "run-tests") }}
  - name: integrate
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-integrate" }}
      methodName: integrate
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: "${{ inputs.state.vmSync }}"
        work: "${{ inputs.launch }}"
        session: "${{ inputs.session }}"
        key: ${{ run.id + "-integrate" }}
        approved: true
        evidence: "${{ inputs.state.evidence }}"
        review: "${{ inputs.state.review }}"
        test: "${{ inputs.state.test }}"
    dependsOn:
    - step: menu-tests
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["confirm"] && data.latest(run.id + "-inspect", "evidence-current").attributes == inputs.state.evidence && inputs.answer == "merge") }}
  - name: approval-stale
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-approval-stale" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-approval-stale" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: prepare
          state:
            vmSync:
            evidence:
            review:
            test:
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: integrate
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["confirm"] && data.latest(run.id + "-inspect", "evidence-current").attributes == inputs.state.evidence && inputs.answer == "merge" && !data.latest(run.id + "-integrate", "integrationDecision-current").attributes.integrated) }}
  - name: integrated
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-integrated" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-integrated" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: cleanup
          state:
            vmSync: "${{ inputs.state.vmSync }}"
            evidence: ${{ data.latest(run.id + "-integrate", "integrationDecision-current").attributes.evidence }}
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: approval-stale
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["confirm"] && data.latest(run.id + "-inspect", "evidence-current").attributes == inputs.state.evidence && inputs.answer == "merge" && data.latest(run.id + "-integrate", "integrationDecision-current").attributes.integrated) }}
  - name: cleanup-question
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: open
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
        question: cleanup
        step: cleanup-approval
        kind: cleanup
        prompt: Integration succeeded. Remove clean worktree or Keep?
        answers:
        - remove-clean-worktree
        - keep
        resumeInput: answer
    dependsOn:
    - step: integrated
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["cleanup"]) }}
  - name: cleanup-approval
    task:
      type: manual_approval
      prompt: Integration succeeded. Remove clean worktree or Keep?
    dependsOn:
    - step: cleanup-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["cleanup"]) }}
  - name: cleanup-answer
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: consume
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        question: cleanup
        answer: "${{ inputs.answer }}"
        submission: "${{ inputs.submission }}"
    dependsOn:
    - step: cleanup-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["cleanup"]) }}
  - name: cleanup
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-cleanup" }}
      methodName: guarded_cleanup
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: "${{ inputs.state.vmSync }}"
        work: "${{ inputs.launch }}"
        session: "${{ inputs.session }}"
        key: ${{ run.id + "-cleanup" }}
        approved: true
        commit: '${{ inputs.state.evidence != null ? inputs.state.evidence.source.commit : "" }}'
    dependsOn:
    - step: cleanup-answer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["cleanup"] && inputs.answer == "remove-clean-worktree") }}
  - name: leave
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-leave" }}
      methodName: pane_action
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-leave" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        action: leave
    dependsOn:
    - step: cleanup
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.answer in ["leave", "leave-paused", "keep"]) }}
reports:
  require:
  - "@hammz/workflow"
