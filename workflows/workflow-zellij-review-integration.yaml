    dependsOn:
    - step: rebase
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["commit"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: rebase-next
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-rebase-next" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-rebase-next" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: '${{ data.latest(run.id + "-rebase", "rebaseResult-current").attributes.evidence.source.rebasing ? (data.latest(run.id + "-rebase", "rebaseResult-current").attributes.evidence.source.conflicts.size() > 0 ? "conflict" : "resolved") : (data.latest(run.id + "-rebase", "rebaseResult-current").attributes.evidence.source.clean ? "review" : "prepare") }}'
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff", "conflict", "tests", "failed-tests", "test-return"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-rebase", "rebaseResult-current").attributes.evidence }}
            review:
            test:
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: rebase-errors
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["commit"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: conflict-question
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: open
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
        question: '${{ data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && data.latest(run.id + "-inspect", "evidence-current").attributes.source.conflicts.size() == 0 ? "resolved" : "conflict" }}'
        step: '${{ data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && data.latest(run.id + "-inspect", "evidence-current").attributes.source.conflicts.size() == 0 ? "resolved-approval" : "conflict-approval" }}'
        kind: conflict
        prompt: '${{ data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && data.latest(run.id + "-inspect", "evidence-current").attributes.source.conflicts.size() == 0 ? "Rebase is paused. Continue rebase, Run tests, or Leave paused?" : "Rebase has conflicts. Resolve with agent, Run tests, or Leave paused?" }}'
        answers: '${{ data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && data.latest(run.id + "-inspect", "evidence-current").attributes.source.conflicts.size() == 0 ? ["continue-rebase", "run-tests", "leave-paused"] : ["resolve-with-agent", "run-tests", "leave-paused"] }}'
        resumeInput: answer
    dependsOn:
    - step: rebase-next
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["conflict", "resolved"] && data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: conflict-approval
    task:
      type: manual_approval
      prompt: Rebase has conflicts. Resolve with agent, Run tests, or Leave paused?
    dependsOn:
    - step: conflict-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["conflict", "resolved"] && data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && data.latest(run.id + "-inspect", "evidence-current").attributes.source.conflicts.size() > 0) }}
  - name: resolved-approval
    task:
      type: manual_approval
      prompt: Rebase is paused. Continue rebase, Run tests, or Leave paused?
