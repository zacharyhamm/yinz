---
id: 7fef23fb-ec77-4be5-a30f-2a5854bbbabd
name: "@hammz/zellij-review-integration"
version: 1
description: User-driven agent exit decisions. Every continuation has a fresh run identity; no agent starts without a choice.
inputs:
  type: object
  properties:
    launch:
      type: string
    session:
      type: string
    checkout:
      type: string
    target:
      type: string
    targetBranch:
      type: string
      default: main
    gate:
      type: array
      items:
        type: string
      default:
      - cargo
      - x
      - ci
      - check
    kind:
      type: string
      default: ''
    answer:
      type: string
      default: ''
    submission:
      type: string
      default: ''
    binary:
      type: string
      default: zellij
    agentCommand:
      type: string
      default: ''
    agentArgs:
      type: array
      items:
        type: string
      default: []
    firecracker:
      type: string
      default: ''
    firecrackerImage:
      type: string
      default: ''
    sourcePane:
      type: integer
      minimum: -1
      default: -1
    phase:
      type: string
      default: prepare
      enum:
      - prepare
      - diff
      - commit
      - conflict
      - resolve
      - resolved
      - review
      - tests
      - failed-tests
      - fix
      - review-agent
      - confirm
      - cleanup
    state:
      type: object
      default:
        vmSync:
        evidence:
        review:
        test:
      additionalProperties: true
    flowVersion:
      type: integer
      default: 2
  required:
  - launch
  - session
  - checkout
  - target
jobs:
- name: main
  steps:
  - name: flow-version
    task:
      type: assert
      expr: has(inputs.flowVersion) && inputs.flowVersion == 2
      message: This suspended run predates the user-driven flow. Preserve it and start a fresh run.
      severity: high
  - name: attach
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-attach" }}
      methodName: workflow_attach
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-attach" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
    dependsOn:
    - step: flow-version
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: sync
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-sync" }}
      methodName: checkout_sync
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-sync" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
    dependsOn:
    - step: attach
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare", "commit", "resolved", "diff"]) }}
  - name: inspect
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-inspect" }}
      methodName: verify_checkout
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
    dependsOn:
    - step: sync
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(!(inputs.phase in ["resolve", "fix", "review-agent", "cleanup", "integrate"])) }}
  - name: paused
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-paused" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-paused" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: conflict
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review:
            test:
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare", "commit"] && data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: prepare-question
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: open
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
        question: prepare
        step: prepare-approval
        kind: choice
        prompt: 'Begin review: Show diff, Commit and rebase, or Leave.'
        answers:
        - show-diff
        - commit-and-rebase
        - leave
        resumeInput: answer
    dependsOn:
    - step: paused
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: prepare-approval
    task:
      type: manual_approval
      prompt: 'Begin review: Show diff, Commit and rebase, or Leave.'
    dependsOn:
    - step: prepare-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: prepare-answer
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: consume
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        question: prepare
        answer: "${{ inputs.answer }}"
        submission: "${{ inputs.submission }}"
    dependsOn:
    - step: prepare-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: prepare-diff
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-prepare-diff" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-prepare-diff" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: diff
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: prepare-answer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && inputs.answer == "show-diff") }}
  - name: prepare-commit
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-prepare-commit" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-prepare-commit" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: commit
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: prepare-diff
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && inputs.answer == "commit-and-rebase") }}
  - name: diff
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-diff" }}
      methodName: command
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-diff" }}
        argv: ["git", "diff"]
        cwd: "${{ inputs.checkout }}"
        foreground: true
    dependsOn:
    - step: prepare-commit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["diff"]) }}
  - name: diff-exit
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-diff-exit" }}
      methodName: observe
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-diff" }}
    dependsOn:
    - step: diff
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["diff"]) }}
  - name: diff-succeeded
    task:
      type: assert
      expr: data.latest(run.id + "-diff-exit", "operation-current").attributes.outcome == "completed" && data.latest(run.id + "-diff-exit", "operation-current").attributes.exitCode == 0
      message: Git diff failed or its completion is uncertain. Inspect the command output in workflow results.
      severity: high
    dependsOn:
    - step: diff-exit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["diff"]) }}
  - name: diff-return
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-diff-return" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-diff-return" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: prepare
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: diff-succeeded
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["diff"]) }}
  - name: commit
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-commit" }}
      methodName: guarded_commit
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
        key: commit
        message: Complete agent work
    dependsOn:
    - step: diff-return
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["commit"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: rebase
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-rebase" }}
      methodName: rebase
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
        key: rebase
    dependsOn:
    - step: commit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["commit"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: rebase-errors
    task:
      type: assert
      expr: data.latest(run.id + "-rebase", "rebaseResult-current").attributes.exitCode == 0 || data.latest(run.id + "-rebase", "rebaseResult-current").attributes.evidence.source.rebasing
      message: Rebase failed. Inspect saved output; no automatic retry.
      severity: high
    dependsOn:
    - step: rebase
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["commit"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: rebase-next
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-rebase-next" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-rebase-next" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: '${{ data.latest(run.id + "-rebase", "rebaseResult-current").attributes.evidence.source.rebasing ? "conflict" : "review" }}'
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-rebase", "rebaseResult-current").attributes.evidence }}
            review:
            test:
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: rebase-errors
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["commit"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: conflict-question
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: open
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
        question: conflict
        step: conflict-approval
        kind: conflict
        prompt: Rebase is paused. Resolve with agent, or Leave paused?
        answers:
        - resolve-with-agent
        - leave-paused
        resumeInput: answer
    dependsOn:
    - step: rebase-next
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["conflict"]) }}
  - name: conflict-approval
    task:
      type: manual_approval
      prompt: Rebase is paused. Resolve with agent, or Leave paused?
    dependsOn:
    - step: conflict-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["conflict"]) }}
  - name: conflict-answer
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: consume
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        question: conflict
        answer: "${{ inputs.answer }}"
        submission: "${{ inputs.submission }}"
    dependsOn:
    - step: conflict-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["conflict"]) }}
  - name: resolve-choice
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-resolve-choice" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-resolve-choice" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: resolve
          state:
            vmSync: "${{ inputs.state.vmSync }}"
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: conflict-answer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["conflict"] && inputs.answer == "resolve-with-agent") }}
  - name: helper-kind
    task:
      type: assert
      expr: inputs.agentCommand != "" || inputs.kind in ["codex", "claude", "cursor"]
      message: Original agent kind is unknown; configure an explicit agent command.
      severity: high
    dependsOn:
    - step: resolve-choice
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["resolve", "fix", "review-agent"]) }}
  - name: review-baseline
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-review-baseline" }}
      methodName: verify_checkout
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: "${{ inputs.state.vmSync }}"
    dependsOn:
    - step: helper-kind
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["review-agent"]) }}
  - name: review-start-stale
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-review-start-stale" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-review-start-stale" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: prepare
          state:
            vmSync:
            evidence:
            review:
            test:
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: review-baseline
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["review-agent"] && data.latest(run.id + "-review-baseline", "evidence-current").attributes != inputs.state.evidence) }}
  - name: prepare-helper-prompt
    task:
      type: model_method
