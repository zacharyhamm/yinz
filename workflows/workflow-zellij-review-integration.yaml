              }
            }
          ],
          "guard": "${{ (!data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready) }}"
        },
        {
          "name": "integrate",
          "task": {
            "type": "model_method",
            "modelType": "@swamp/git",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-integration\" }}",
            "methodName": "integrate",
            "globalArgs": {
              "repoPath": "${{ inputs.checkout }}"
            },
            "inputs": {
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "vmSync": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.review.evidence.vmSync }}",
              "key": "integrate",
              "evidence": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.review.evidence }}",
              "review": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.review }}",
              "test": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.test }}",
              "approved": true,
              "binary": "${{ inputs.binary }}",
              "source": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "decision-answer",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ (!data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready) || (data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"merge\") }}"
        },
        {
          "name": "cleanup-question",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/question",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-questions\" }}",
            "methodName": "open",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "run": "${{ run.id }}",
              "workflow": "${{ run.workflowName }}",
              "question": "cleanup",
              "step": "cleanup-approval",
              "kind": "cleanup",
              "prompt": "Remove the integrated clean secondary worktree?",
              "answers": [
                "remove",
                "keep"
              ],
              "resumeInput": "answer"
            }
          },
          "dependsOn": [
            {
              "step": "integrate",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"merge\" || !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-integration\", \"integrationDecision-current\").attributes.integrated }}"
        },
        {
          "name": "cleanup-approval",
          "task": {
            "type": "manual_approval",
            "prompt": "Remove the integrated clean secondary worktree?"
          },
          "dependsOn": [
            {
              "step": "cleanup-question",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"merge\" || !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-integration\", \"integrationDecision-current\").attributes.integrated }}"
        },
        {
          "name": "cleanup-answer",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/question",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-questions\" }}",
            "methodName": "consume",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "run": "${{ run.id }}",
              "question": "cleanup",
              "answer": "${{ inputs.answer }}",
              "submission": "${{ inputs.submission }}"
            }
          },
          "dependsOn": [
            {
              "step": "cleanup-approval",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"merge\" || !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-integration\", \"integrationDecision-current\").attributes.integrated }}"
        },
        {
          "name": "cleanup-worktree",
          "task": {
            "type": "model_method",
            "modelType": "@swamp/git",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-integration\" }}",
            "methodName": "guarded_cleanup",
            "globalArgs": {
              "repoPath": "${{ inputs.checkout }}"
            },
            "inputs": {
              "target": "${{ inputs.target }}",
              "targetBranch": "${{ inputs.targetBranch }}",
              "gate": "${{ inputs.gate }}",
              "vmSync": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.review.evidence.vmSync }}",
              "key": "cleanup",
              "approved": true,
              "commit": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.review.evidence.source.commit }}",
              "binary": "${{ inputs.binary }}",
              "source": "${{ inputs.checkout }}"
            }
          },
          "dependsOn": [
            {
              "step": "cleanup-answer",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"merge\" || !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-integration\", \"integrationDecision-current\").attributes.integrated || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"cleanup\").attributes.answer != \"remove\" }}"
        },
        {
          "name": "continue-question",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/question",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-questions\" }}",
            "methodName": "open",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "run": "${{ run.id }}",
              "workflow": "${{ run.workflowName }}",
              "question": "continue",
              "step": "continue-approval",
              "kind": "instructions",
              "prompt": "What should the worker do next?",
              "answers": [],
              "resumeInput": "answer"
            }
          },
          "dependsOn": [
            {
              "step": "cleanup-worktree",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"continue\" }}"
        },
        {
          "name": "continue-approval",
          "task": {
            "type": "manual_approval",
            "prompt": "Provide instructions for continued work."
          },
          "dependsOn": [
            {
              "step": "continue-question",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"continue\" }}"
        },
        {
          "name": "continue-answer",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/question",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-questions\" }}",
            "methodName": "consume",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "run": "${{ run.id }}",
              "question": "continue",
              "answer": "${{ inputs.answer }}",
              "submission": "${{ inputs.submission }}"
            }
          },
          "dependsOn": [
            {
              "step": "continue-approval",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"continue\" }}"
        },
        {
          "name": "continued-work-prompt",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-worker-turn\" }}",
            "methodName": "agent_prompt",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-continued-work\" }}",
              "agent": "worker",
              "prompt": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"continue\").attributes.answer }}"
            }
          },
          "dependsOn": [
            {
              "step": "continue-answer",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"continue\" }}"
        },
        {
          "name": "continued-work-completion",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-worker-turn\" }}",
            "methodName": "observe",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ inputs.cycle + \"-continued-work\" }}",
              "timeoutSeconds": 3600
            }
          },
          "dependsOn": [
            {
              "step": "continued-work-prompt",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"continue\" }}"
        },
        {
          "name": "continued-work-completed",
          "task": {
            "type": "assert",
            "expr": "data.latest(inputs.launch + \"-worker-turn\", \"operation-current\").attributes.outcome == \"completed\"",
            "message": "The instructed work must explicitly complete before a fresh review cycle.",
            "severity": "high"
          },
          "dependsOn": [
            {
              "step": "continued-work-completion",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ !data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready || data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer != \"continue\" }}"
        },
        {
          "name": "next-review",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/zellij",
            "modelName": "${{ inputs.launch + \"-\" + inputs.cycle + \"-continuation\" }}",
            "methodName": "continue_review",
            "globalArgs": {
              "session": "${{ inputs.session }}",
              "binary": "${{ inputs.binary }}"
            },
            "inputs": {
              "work": "${{ inputs.launch }}",
              "key": "${{ \"next-\" + run.id }}",
              "inputs": {
                "launch": "${{ inputs.launch }}",
                "session": "${{ inputs.session }}",
                "binary": "${{ inputs.binary }}",
                "checkout": "${{ inputs.checkout }}",
                "target": "${{ inputs.target }}",
                "targetBranch": "${{ inputs.targetBranch }}",
                "gate": "${{ inputs.gate }}",
                "kind": "${{ inputs.kind }}",
                "task": "${{ inputs.task }}",
                "agentCommand": "${{ inputs.agentCommand }}",
                "agentArgs": "${{ inputs.agentArgs }}",
                "firecracker": "${{ inputs.firecracker }}",
                "firecrackerImage": "${{ inputs.firecrackerImage }}",
                "cycle": "${{ run.id }}"
              }
            }
          },
          "dependsOn": [
            {
              "step": "continued-work-completed",
              "condition": {
                "type": "or",
                "conditions": [
                  {
                    "type": "succeeded"
                  },
                  {
                    "type": "skipped"
                  }
                ]
              }
            }
          ],
          "guard": "${{ data.latest(inputs.launch + \"-\" + inputs.cycle + \"-assessment\", \"assessment-current\").attributes.ready && data.latest(inputs.launch + \"-\" + inputs.cycle + \"-questions\", \"decision\").attributes.answer == \"merge\" && data.latest(inputs.launch + \"-\" + inputs.cycle + \"-integration\", \"integrationDecision-current\").attributes.integrated }}"
        }
      ]
    }
  ],
  "reports": {
    "require": [
      "@hammz/workflow"
    ]
  }
}
