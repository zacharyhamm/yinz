            ? inputs.testFixAgent : inputs.phase == "review-fix" ? inputs.reviewFixAgent : inputs.reviewAgent).kind : inputs.kind }}'
          command: '${{ ("command" in (inputs.phase == "resolve" ? inputs.rebaseAgent : inputs.phase == "fix" ? inputs.testFixAgent : inputs.phase
