        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
        question: cleanup
        step: cleanup-approval
        kind: cleanup
        prompt: Integration succeeded. Remove clean worktree or Keep?
        answers:
        - remove-clean-worktree
        - keep
        resumeInput: answer
    dependsOn:
    - step: integrated
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["cleanup"]) }}
  - name: cleanup-approval
    task:
      type: manual_approval
      prompt: Integration succeeded. Remove clean worktree or Keep?
    dependsOn:
    - step: cleanup-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["cleanup"]) }}
  - name: cleanup-answer
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: consume
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        question: cleanup
        answer: "${{ inputs.answer }}"
        submission: "${{ inputs.submission }}"
    dependsOn:
    - step: cleanup-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["cleanup"]) }}
  - name: cleanup
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-cleanup" }}
      methodName: guarded_cleanup
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: "${{ inputs.state.vmSync }}"
        key: cleanup
        approved: true
        commit: '${{ inputs.state.evidence != null ? inputs.state.evidence.source.commit : "" }}'
    dependsOn:
    - step: cleanup-answer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["cleanup"] && inputs.answer == "remove-clean-worktree") }}
  - name: leave
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-leave" }}
      methodName: pane_action
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-leave" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        action: leave
    dependsOn:
    - step: cleanup
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.answer in ["leave", "leave-paused", "keep"]) }}
reports:
  require:
  - "@hammz/workflow"
