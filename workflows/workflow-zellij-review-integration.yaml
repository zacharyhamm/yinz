    dependsOn:
    - step: resolve-choice
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["resolve", "fix", "review-agent"]) }}
  - name: review-baseline
    task:
      type: model_method
      modelType: "@swamp/git"
