---
id: 7fef23fb-ec77-4be5-a30f-2a5854bbbabd
name: "@hammz/zellij-review-integration"
version: 1
description: User-driven agent exit decisions. Every continuation has a fresh run identity; no agent starts without a choice.
inputs:
  type: object
  properties:
    launch:
      type: string
    session:
      type: string
    checkout:
      type: string
    target:
      type: string
    targetBranch:
      type: string
      default: main
    gate:
      type: array
      items:
        type: string
      default:
      - cargo
      - x
      - ci
      - check
    kind:
      type: string
      default: ''
    answer:
      type: string
      default: ''
    submission:
      type: string
      default: ''
    binary:
      type: string
      default: zellij
    agentCommand:
      type: string
      default: ''
    commitAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    rebasePrompt:
      type: string
      minLength: 1
      pattern: '\S'
      default: "Resolve only the current rebase conflicts in this checkout and stage each resolution. Do not run rebase --continue or --abort: the workflow owns continuation. Do not merge, remove resources, or contact remotes. Report the result and exit when done."
    agentArgs:
      type: array
      items:
        type: string
      default: []
    firecracker:
      type: string
      default: ''
    firecrackerImage:
      type: string
      default: ''
    sourcePane:
      type: integer
      minimum: -1
      default: -1
    phase:
      type: string
      default: prepare
      enum:
      - prepare
      - diff
      - commit
      - conflict
      - resolve
      - resolved
      - review
      - tests
      - failed-tests
      - test-return
      - fix
      - review-agent
      - confirm
      - cleanup
    testReturn:
      type: object
      default:
        workflow: "@hammz/zellij-review-integration"
        phase: review
      properties:
        workflow:
          type: string
          enum: ["@hammz/zellij-agent-exit", "@hammz/zellij-review-integration"]
        phase:
          type: string
          enum: [prepare, conflict, resolved, review, confirm]
      required: [workflow, phase]
      additionalProperties: false
    state:
      type: object
      default:
        vmSync:
        evidence:
        review:
        test:
      additionalProperties: true
    flowVersion:
      type: integer
      default: 2
  required:
  - launch
  - session
  - checkout
  - target
jobs:
- name: main
  steps:
  - name: flow-version
    task:
      type: assert
      expr: has(inputs.flowVersion) && inputs.flowVersion == 2
      message: This suspended run predates the user-driven flow. Preserve it and start a fresh run.
      severity: high
  - name: attach
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-attach" }}
      methodName: workflow_attach
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-attach" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
    dependsOn:
    - step: flow-version
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: sync
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-sync" }}
      methodName: checkout_sync
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-sync" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
    dependsOn:
    - step: attach
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare", "commit", "resolved", "diff", "conflict", "tests", "failed-tests", "test-return"]) }}
  - name: inspect
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-inspect" }}
      methodName: verify_checkout
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff", "conflict", "tests", "failed-tests", "test-return"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
    dependsOn:
    - step: sync
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(!(inputs.phase in ["resolve", "fix", "review-agent", "cleanup", "integrate"])) }}
  - name: paused
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-paused" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-paused" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: '${{ data.latest(run.id + "-inspect", "evidence-current").attributes.source.conflicts.size() > 0 ? "conflict" : "resolved" }}'
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff", "conflict", "tests", "failed-tests", "test-return"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review:
            test:
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare", "commit"] && data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: prepare-question
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: open
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        workflow: "${{ run.workflowName }}"
        question: prepare
        step: prepare-approval
        kind: choice
        prompt: 'Begin review: Show diff, Commit and rebase, Run tests, or Leave.'
        answers:
        - show-diff
        - commit-and-rebase
        - run-tests
        - leave
        resumeInput: answer
    dependsOn:
    - step: paused
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: prepare-approval
    task:
      type: manual_approval
      prompt: 'Begin review: Show diff, Commit and rebase, Run tests, or Leave.'
    dependsOn:
    - step: prepare-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: prepare-answer
    task:
      type: model_method
      modelType: "@hammz/question"
      modelName: ${{ run.id + "-questions" }}
      methodName: consume
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        run: "${{ run.id }}"
        question: prepare
        answer: "${{ inputs.answer }}"
        submission: "${{ inputs.submission }}"
    dependsOn:
    - step: prepare-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: prepare-diff
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-prepare-diff" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-prepare-diff" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: diff
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff", "conflict", "tests", "failed-tests", "test-return"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: prepare-answer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && inputs.answer == "show-diff") }}
  - name: prepare-commit
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-prepare-commit" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-prepare-commit" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: commit
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff", "conflict", "tests", "failed-tests", "test-return"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: prepare-diff
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["prepare"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && inputs.answer == "commit-and-rebase") }}
  - name: diff
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-diff" }}
      methodName: command
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-diff" }}
        argv:
        - bash
        - -c
        - |
          set -eu
          unset $(git rev-parse --local-env-vars)
          cd -- "$1" || { printf 'Show diff: checkout unavailable: %s\n' "$1" >&2; exit 1; }
          viewer=$(mktemp -d "${TMPDIR:-/tmp}/zellij-show-diff.XXXXXX")
          trap 'rm -rf "$viewer"' EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM
          viewer=$(cd -- "$viewer" && pwd -P)
          git --no-pager diff --color=always > "$viewer/diff"
          git ls-files --others --exclude-standard -z > "$viewer/untracked"
          while IFS= read -r -d '' path; do
            case "$(pwd -P)/$path" in "$viewer"/*) continue ;; esac
            if [ -d "$path" ]; then
              printf 'Untracked nested repository: %q\n' "$path" >> "$viewer/diff"
              continue
            fi
            git --no-pager diff --no-index --color=always -- /dev/null "$path" >> "$viewer/diff" || [ "$?" -eq 1 ]
          done < "$viewer/untracked"
          if [ ! -s "$viewer/diff" ]; then
            printf 'No unstaged or untracked changes.\n' > "$viewer/diff"
          fi
          # Distinguish Escape from arrows; -X keeps less from resetting this mode.
          printf '\033[>1u'
          trap 'printf "\033[<u"; rm -rf "$viewer"' EXIT
          printf '%s\n' '#command' '\e[27u quit' '\e[27;1u quit' 'q quit' \
            '\e[A back-line' '\e[B forw-line' \
            '\e[C right-scroll' '\e[D left-scroll' > "$viewer/keys"
          LESS= LESSOPEN= LESSCLOSE= LESSKEY= LESSKEYIN= LESSKEYIN_SYSTEM= LESSKEY_SYSTEM= LESSHISTFILE=- \
            less --lesskey-src="$viewer/keys" -RX -+F -+E -+e \
            -P 'Show diff — q to return' -- "$viewer/diff"
        - show-diff
        - "${{ inputs.checkout }}"
        cwd: "${{ inputs.checkout }}"
        foreground: true
    dependsOn:
    - step: prepare-commit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["diff"]) }}
  - name: diff-exit
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-diff-exit" }}
      methodName: observe
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-diff" }}
    dependsOn:
    - step: diff
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["diff"]) }}
  - name: diff-succeeded
    task:
      type: assert
      expr: data.latest(run.id + "-diff-exit", "operation-current").attributes.outcome == "completed" && data.latest(run.id + "-diff-exit", "operation-current").attributes.exitCode == 0
      message: Git diff failed or its completion is uncertain. Inspect the command output in workflow results.
      severity: high
    dependsOn:
    - step: diff-exit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["diff"]) }}
  - name: diff-return
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-diff-return" }}
      methodName: continue_flow
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        key: ${{ run.id + "-diff-return" }}
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        workflow: "@hammz/zellij-review-integration"
        inputs:
          launch: "${{ inputs.launch }}"
          session: "${{ inputs.session }}"
          checkout: "${{ inputs.checkout }}"
          target: "${{ inputs.target }}"
          targetBranch: "${{ inputs.targetBranch }}"
          gate: "${{ inputs.gate }}"
          kind: "${{ inputs.kind }}"
          binary: "${{ inputs.binary }}"
          agentCommand: "${{ inputs.agentCommand }}"
          agentArgs: "${{ inputs.agentArgs }}"
          commitAgent: "${{ inputs.commitAgent }}"
          rebasePrompt: "${{ inputs.rebasePrompt }}"
          firecracker: "${{ inputs.firecracker }}"
          firecrackerImage: "${{ inputs.firecrackerImage }}"
          sourcePane: "${{ inputs.sourcePane }}"
          phase: prepare
          state:
            vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff", "conflict", "tests", "failed-tests", "test-return"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: "${{ inputs.state.review }}"
            test: "${{ inputs.state.test }}"
          testReturn: "${{ inputs.testReturn }}"
          flowVersion: "${{ inputs.flowVersion }}"
    dependsOn:
    - step: diff-succeeded
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["diff"]) }}
  - name: commit-kind
    task:
      type: assert
      expr: '(has(inputs.commitAgent.command) ? inputs.commitAgent.command : size(inputs.commitAgent) == 0 ? inputs.agentCommand : "") != "" || (has(inputs.commitAgent.kind) ? inputs.commitAgent.kind : inputs.kind) in ["codex", "claude", "cursor", "opencode"]'
      message: Commit agent kind is unknown; configure commit_agent in .zellij/swamp-workflows.kdl.
      severity: high
    dependsOn:
    - step: diff-return
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "commit" && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.clean) }}
  - name: commit-prompt
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-commit-prompt" }}
      methodName: prepare_prompt
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        prompt: '${{ "Write a commit message for the pending changes in this checkout. Inspect the branch changes against local target branch " + inputs.targetBranch + ", including staged, unstaged and untracked files; use existing branch commits as context but describe the changes this new commit will contain. Leave files and Git state untouched. Do not commit, rebase, merge, remove resources or contact remotes. Return only JSON {\"message\":\"Descriptive subject\\n\\nExplanatory body\"}, without Markdown fences or commentary. Then exit." }}'
    dependsOn:
    - step: commit-kind
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "commit" && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.clean) }}
  - name: commit-agent
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-commit-agent" }}
      methodName: agent_spawn
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        key: ${{ run.id + "-commit-agent" }}
        spec:
          kind: '${{ has(inputs.commitAgent.kind) ? inputs.commitAgent.kind : inputs.kind }}'
          command: '${{ has(inputs.commitAgent.command) ? inputs.commitAgent.command : size(inputs.commitAgent) == 0 ? inputs.agentCommand : "" }}'
          args: '${{ has(inputs.commitAgent.args) ? inputs.commitAgent.args : size(inputs.commitAgent) == 0 ? inputs.agentArgs : [] }}'
          model: '${{ has(inputs.commitAgent.model) ? inputs.commitAgent.model : "" }}'
          effort: '${{ has(inputs.commitAgent.effort) ? inputs.commitAgent.effort : "" }}'
          cwd: "${{ inputs.checkout }}"
          source_directory: "${{ inputs.checkout }}"
          reuse: true
    dependsOn:
    - step: commit-prompt
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "commit" && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.clean) }}
  - name: commit-agent-prompt
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-commit-agent-prompt" }}
      methodName: agent_prompt
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        key: ${{ run.id + "-commit-agent-prompt" }}
        agent: ${{ run.id + "-commit-agent" }}
        prompt: ${{ data.latest(run.id + "-commit-prompt", "prompt-current").attributes.prompt }}
        waitForExit: true
    dependsOn:
    - step: commit-agent
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "commit" && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.clean) }}
  - name: commit-agent-exit
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-commit-agent-exit" }}
      methodName: observe
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        work: "${{ inputs.launch }}"
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
        key: ${{ run.id + "-commit-agent-prompt" }}
    dependsOn:
    - step: commit-agent-prompt
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "commit" && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.clean) }}
  - name: commit-message
    task:
      type: model_method
      modelType: "@hammz/zellij"
      modelName: ${{ run.id + "-commit-message" }}
      methodName: commit_message_result
      globalArgs:
        session: "${{ inputs.session }}"
        binary: "${{ inputs.binary }}"
      inputs:
        operation: ${{ data.latest(run.id + "-commit-agent-exit", "operation-current").attributes }}
        evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
        agent: ${{ run.id + "-commit-agent" }}
    dependsOn:
    - step: commit-agent-exit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "commit" && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.clean) }}
  - name: rebase
    task:
      type: model_method
      modelType: "@swamp/git"
      modelName: ${{ run.id + "-rebase" }}
      methodName: commit_and_rebase
      globalArgs:
        repoPath: "${{ inputs.checkout }}"
      inputs:
        source: "${{ inputs.checkout }}"
        target: "${{ inputs.target }}"
        targetBranch: "${{ inputs.targetBranch }}"
        gate: "${{ inputs.gate }}"
        binary: "${{ inputs.binary }}"
        vmSync: '${{ (inputs.phase in ["prepare", "commit", "resolved", "diff", "conflict", "tests", "failed-tests", "test-return"]) ? data.latest(run.id + "-sync", "checkoutSync-current").attributes : inputs.state.vmSync }}'
        work: "${{ inputs.launch }}"
        session: "${{ inputs.session }}"
        key: ${{ run.id + "-commit-and-rebase" }}
        message: '${{ data.latest(run.id + "-inspect", "evidence-current").attributes.source.clean ? "No changes to commit" : data.latest(run.id + "-commit-message", "commitMessage-current").attributes.message }}'
        expectedEvidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
    dependsOn:
    - step: commit-message
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["commit"] && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing) }}
  - name: rebase-errors
    task:
      type: assert
      expr: data.latest(run.id + "-rebase", "rebaseResult-current").attributes.exitCode == 0 || data.latest(run.id + "-rebase", "rebaseResult-current").attributes.evidence.source.rebasing
      message: Commit or rebase failed. Inspect the command pane output; no automatic retry.
