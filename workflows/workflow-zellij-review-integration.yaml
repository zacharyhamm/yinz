        answer: "${{ inputs.answer }}"
        submission: "${{ inputs.submission }}"
    dependsOn:
    - step: resolved-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    - step: conflict-approval
      condition:
        type: or
        conditions:
        - type: succeeded
