id: 7fef23fb-ec77-4be5-a30f-2a5854bbbabd
name: '@hammz/zellij-review-integration'
description: Repeatable local validation. Every action is a developer choice; merge requires current passing checks.
version: 2
inputs:
  type: object
  properties:
    launch:
      type: string
    session:
      type: string
    checkout:
      type: string
    target:
      type: string
    targetBranch:
      type: string
      default: main
    gate:
      type: array
      default:
      - cargo
      - x
      - ci
      - check
      items:
        type: string
    kind:
      type: string
      default: ''
    answer:
      type: string
      default: ''
    submission:
      type: string
      default: ''
    binary:
      type: string
      default: zellij
    agentCommand:
      type: string
      default: ''
    commitAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    rebasePrompt:
      type: string
      default: 'Resolve only the current rebase conflicts in this checkout and stage each resolution. Do not run rebase --continue or --abort:
        the workflow owns continuation. Do not merge, remove resources, or contact remotes. Report the result and exit when done.'
      minLength: 1
      pattern: \S
    agentArgs:
      type: array
      default: []
      items:
        type: string
    firecracker:
      type: string
      default: ''
    firecrackerImage:
      type: string
      default: ''
    sourcePane:
      type: integer
      default: -1
      minimum: -1
    phase:
      type: string
      default: prepare
      enum:
      - prepare
      - diff
      - commit
      - resolve
      - continue
      - review-agent
      - review-fix
      - fix
      - tests
      - confirm
      - cleanup
    testReturn:
      type: object
      default:
        workflow: '@hammz/zellij-review-integration'
        phase: review
      properties:
        workflow:
          type: string
          enum:
          - '@hammz/zellij-agent-exit'
          - '@hammz/zellij-review-integration'
        phase:
          type: string
          enum:
          - prepare
          - conflict
          - resolved
          - review
          - confirm
      required:
      - workflow
      - phase
      additionalProperties: false
    state:
      type: object
      default:
        vmSync: null
        evidence: null
        review: null
        test: null
      additionalProperties: true
    flowVersion:
      type: integer
      default: 3
    reviewAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    reviewFixAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    rebaseAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
    testFixAgent:
      type: object
      default: {}
      properties:
        kind:
          type: string
          enum:
          - ''
          - claude
          - codex
          - cursor
          - opencode
        model:
          type: string
        effort:
          type: string
        command:
          type: string
        args:
          type: array
          items:
            type: string
      additionalProperties: false
  required:
  - launch
  - session
  - checkout
  - target
reports:
  require:
  - '@hammz/workflow'
jobs:
- name: main
  steps:
  - name: flow-version
    task:
      type: assert
      expr: has(inputs.flowVersion) && inputs.flowVersion == 3
      message: This suspended decision uses an older flow. Preserve it and start a fresh launch.
      severity: high
  - name: attach
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-attach" }}
      methodName: workflow_attach
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-attach" }}
        run: ${{ run.id }}
        workflow: ${{ run.workflowName }}
    dependsOn:
    - step: flow-version
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: step-ready
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-step-ready" }}
      methodName: step_ready
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-step-ready" }}
    dependsOn:
    - step: attach
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: sync
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-sync" }}
      methodName: checkout_sync
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-sync" }}
        previous: ${{ inputs.state.vmSync }}
    dependsOn:
    - step: step-ready
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: inspect
    task:
      type: model_method
      modelType: '@swamp/git'
      modelName: ${{ run.id + "-inspect" }}
      methodName: verify_checkout
      globalArgs:
        repoPath: ${{ inputs.checkout }}
      inputs:
        source: ${{ inputs.checkout }}
        target: ${{ inputs.target }}
        targetBranch: ${{ inputs.targetBranch }}
        gate: ${{ inputs.gate }}
        binary: ${{ inputs.binary }}
        vmSync: ${{ data.latest(run.id + "-sync", "checkoutSync-current").attributes }}
    dependsOn:
    - step: sync
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: checks
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-checks" }}
      methodName: check_status
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
        review: ${{ inputs.state.review }}
        test: ${{ inputs.state.test }}
    dependsOn:
    - step: inspect
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
  - name: prepare-question
    task:
      type: model_method
      modelType: '@hammz/question'
      modelName: ${{ run.id + "-questions" }}
      methodName: open
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        run: ${{ run.id }}
        workflow: ${{ run.workflowName }}
        question: prepare
        step: prepare-approval
        kind: choice
        prompt: '${{ "Review: " + data.latest(run.id + "-checks", "checks-current").attributes.codeReview + ". Tests: " + data.latest(run.id +
          "-checks", "checks-current").attributes.tests + ". " + (data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing
          ? "Rebase paused. Resolvers stage changes; Continue rebase is a separate choice. " : "") + (data.latest(run.id + "-checks", "checks-current").attributes.ready
          ? "Ready for merge approval." : data.latest(run.id + "-checks", "checks-current").attributes.recommendation) }}'
        answers: '${{ ["show-diff", "review", "commit-and-rebase", "run-tests", "merge", "leave"] + (data.latest(run.id + "-checks", "checks-current").attributes.repairReview
          ? ["fix-review-with-agent"] : []) + (data.latest(run.id + "-checks", "checks-current").attributes.repairTests ? ["fix-tests-with-agent"] : []) + (data.latest(run.id
          + "-inspect", "evidence-current").attributes.source.rebasing ? ["resolve-with-agent", "continue-rebase", "leave-paused"] : []) + (inputs.sourcePane
          >= 0 ? ["restart", "fork"] : []) }}'
        resumeInput: answer
    dependsOn:
    - step: checks
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "prepare") }}
  - name: prepare-approval
    task:
      type: manual_approval
      prompt: Choose an action in the saved workflow question.
    dependsOn:
    - step: prepare-question
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "prepare") }}
  - name: prepare-answer
    task:
      type: model_method
      modelType: '@hammz/question'
      modelName: ${{ run.id + "-questions" }}
      methodName: consume
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        run: ${{ run.id }}
        question: prepare
        answer: ${{ inputs.answer }}
        submission: ${{ inputs.submission }}
    dependsOn:
    - step: prepare-approval
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "prepare") }}
  - name: menu-choice
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-menu-choice" }}
      methodName: continue_flow
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-menu-choice" }}
        workflow: '@hammz/zellij-review-integration'
        inputs:
          launch: ${{ inputs.launch }}
          session: ${{ inputs.session }}
          checkout: ${{ inputs.checkout }}
          target: ${{ inputs.target }}
          targetBranch: ${{ inputs.targetBranch }}
          gate: ${{ inputs.gate }}
          kind: ${{ inputs.kind }}
          binary: ${{ inputs.binary }}
          agentCommand: ${{ inputs.agentCommand }}
          agentArgs: ${{ inputs.agentArgs }}
          commitAgent: ${{ inputs.commitAgent }}
          reviewAgent: ${{ inputs.reviewAgent }}
          reviewFixAgent: ${{ inputs.reviewFixAgent }}
          rebaseAgent: ${{ inputs.rebaseAgent }}
          testFixAgent: ${{ inputs.testFixAgent }}
          rebasePrompt: ${{ inputs.rebasePrompt }}
          firecracker: ${{ inputs.firecracker }}
          firecrackerImage: ${{ inputs.firecrackerImage }}
          sourcePane: ${{ inputs.sourcePane }}
          flowVersion: ${{ inputs.flowVersion }}
          testReturn: ${{ inputs.testReturn }}
          phase: '${{ inputs.answer == "show-diff" ? "diff" : inputs.answer in ["review", "review-again"] ? "review-agent" : inputs.answer ==
            "commit-and-rebase" ? "commit" : inputs.answer in ["run-tests", "retry-tests"] ? "tests" : inputs.answer == "fix-review-with-agent"
            ? "review-fix" : inputs.answer == "fix-tests-with-agent" ? "fix" : inputs.answer == "resolve-with-agent" ? "resolve" : inputs.answer
            == "continue-rebase" ? "continue" : data.latest(run.id + "-checks", "checks-current").attributes.ready ? "confirm" : "prepare" }}'
          state:
            vmSync: ${{ data.latest(run.id + "-sync", "checkoutSync-current").attributes }}
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: ${{ inputs.state.review }}
            test: ${{ inputs.state.test }}
        invalidateChecks: false
    dependsOn:
    - step: prepare-answer
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "prepare" && !(inputs.answer in ["leave", "leave-paused", "restart", "fork"])) }}
  - name: pane-choice
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-pane-choice" }}
      methodName: pane_action
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-pane-choice" }}
        action: ${{ inputs.answer }}
    dependsOn:
    - step: menu-choice
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "prepare" && inputs.answer in ["restart", "fork"]) }}
  - name: picker-result
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-picker-result" }}
      methodName: observe
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-pane-choice" }}
    dependsOn:
    - step: pane-choice
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "prepare" && inputs.answer == "fork") }}
  - name: picker-cancelled
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-picker-cancelled" }}
      methodName: continue_flow
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-picker-cancelled" }}
        workflow: '@hammz/zellij-review-integration'
        inputs:
          launch: ${{ inputs.launch }}
          session: ${{ inputs.session }}
          checkout: ${{ inputs.checkout }}
          target: ${{ inputs.target }}
          targetBranch: ${{ inputs.targetBranch }}
          gate: ${{ inputs.gate }}
          kind: ${{ inputs.kind }}
          binary: ${{ inputs.binary }}
          agentCommand: ${{ inputs.agentCommand }}
          agentArgs: ${{ inputs.agentArgs }}
          commitAgent: ${{ inputs.commitAgent }}
          reviewAgent: ${{ inputs.reviewAgent }}
          reviewFixAgent: ${{ inputs.reviewFixAgent }}
          rebaseAgent: ${{ inputs.rebaseAgent }}
          testFixAgent: ${{ inputs.testFixAgent }}
          rebasePrompt: ${{ inputs.rebasePrompt }}
          firecracker: ${{ inputs.firecracker }}
          firecrackerImage: ${{ inputs.firecrackerImage }}
          sourcePane: ${{ inputs.sourcePane }}
          flowVersion: ${{ inputs.flowVersion }}
          testReturn: ${{ inputs.testReturn }}
          phase: prepare
          state:
            vmSync: ${{ data.latest(run.id + "-sync", "checkoutSync-current").attributes }}
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: ${{ inputs.state.review }}
            test: ${{ inputs.state.test }}
        invalidateChecks: false
    dependsOn:
    - step: picker-result
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "prepare" && inputs.answer == "fork" && data.latest(run.id + "-picker-result", "operation-current").attributes.choice
      == "cancelled") }}
  - name: diff
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-diff" }}
      methodName: command
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-diff" }}
        argv:
        - bash
        - -c
        - "set -eu\nunset $(git rev-parse --local-env-vars)\ncd -- \"$1\" || { printf 'Show diff: checkout unavailable: %s\\n' \"$1\" >&2; exit\
          \ 1; }\nviewer=$(mktemp -d \"${TMPDIR:-/tmp}/zellij-show-diff.XXXXXX\")\ntrap 'rm -rf \"$viewer\"' EXIT\ntrap 'exit 129' HUP\ntrap 'exit\
          \ 130' INT\ntrap 'exit 143' TERM\nviewer=$(cd -- \"$viewer\" && pwd -P)\nprintf 'Committed branch changes:\\n' > \"$viewer/diff\"\n\
          git --no-pager diff --no-ext-diff --no-textconv --color=always \"$2...HEAD\" -- >> \"$viewer/diff\"\nprintf '\\nStaged changes:\\n'\
          \ >> \"$viewer/diff\"\ngit --no-pager diff --cached --no-ext-diff --no-textconv --color=always -- >> \"$viewer/diff\"\nprintf '\\nUnstaged\
          \ changes:\\n' >> \"$viewer/diff\"\ngit --no-pager diff --no-ext-diff --no-textconv --color=always -- >> \"$viewer/diff\"\ngit ls-files\
          \ --others --exclude-standard -z > \"$viewer/untracked\"\nwhile IFS= read -r -d '' path; do\n  case \"$(pwd -P)/$path\" in \"$viewer\"\
          /*) continue ;; esac\n  if [ -d \"$path\" ]; then\n    printf 'Untracked nested repository: %q\\n' \"$path\" >> \"$viewer/diff\"\n \
          \   continue\n  fi\n  git --no-pager diff --no-index --no-ext-diff --no-textconv --color=always -- /dev/null \"$path\" >> \"$viewer/diff\"\
          \ || [ \"$?\" -eq 1 ]\ndone < \"$viewer/untracked\"\n# Distinguish Escape from arrows; -X keeps less from resetting this mode.\nprintf\
          \ '\\033[>1u'\ntrap 'printf \"\\033[<u\"; rm -rf \"$viewer\"' EXIT\nprintf '%s\\n' '#command' '\\e[27u quit' '\\e[27;1u quit' 'q quit'\
          \ \\\n  '\\e[A back-line' '\\e[B forw-line' \\\n  '\\e[C right-scroll' '\\e[D left-scroll' > \"$viewer/keys\"\nLESS= LESSOPEN= LESSCLOSE=\
          \ LESSKEY= LESSKEYIN= LESSKEYIN_SYSTEM= LESSKEY_SYSTEM= LESSHISTFILE=- \\\n  less --lesskey-src=\"$viewer/keys\" -RX -+F -+E -+e \\\n\
          \  -P 'Show diff \u2014 q to return' -- \"$viewer/diff\"\n"
        - show-diff
        - ${{ inputs.checkout }}
        - ${{ data.latest(run.id + "-inspect", "evidence-current").attributes.target.commit }}
        cwd: ${{ inputs.checkout }}
        foreground: true
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
    dependsOn:
    - step: picker-cancelled
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "diff") }}
  - name: diff-exit
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-diff-exit" }}
      methodName: observe
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-diff" }}
    dependsOn:
    - step: diff
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "diff") }}
  - name: diff-known
    task:
      type: assert
      expr: data.latest(run.id + "-diff-exit", "operation-current").attributes.outcome in ["completed", "failed", "process-exit", "cancelled"]
        && (data.latest(run.id + "-diff-exit", "operation-current").attributes.outcome != "cancelled" || data.latest(run.id + "-diff-exit", "operation-current").attributes.terminationVerified)
      message: Process completion is uncertain. Reconcile the saved operation before another step.
      severity: high
    dependsOn:
    - step: diff-exit
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "diff") }}
  - name: diff-return
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-diff-return" }}
      methodName: continue_flow
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-diff-return" }}
        workflow: '@hammz/zellij-review-integration'
        inputs:
          launch: ${{ inputs.launch }}
          session: ${{ inputs.session }}
          checkout: ${{ inputs.checkout }}
          target: ${{ inputs.target }}
          targetBranch: ${{ inputs.targetBranch }}
          gate: ${{ inputs.gate }}
          kind: ${{ inputs.kind }}
          binary: ${{ inputs.binary }}
          agentCommand: ${{ inputs.agentCommand }}
          agentArgs: ${{ inputs.agentArgs }}
          commitAgent: ${{ inputs.commitAgent }}
          reviewAgent: ${{ inputs.reviewAgent }}
          reviewFixAgent: ${{ inputs.reviewFixAgent }}
          rebaseAgent: ${{ inputs.rebaseAgent }}
          testFixAgent: ${{ inputs.testFixAgent }}
          rebasePrompt: ${{ inputs.rebasePrompt }}
          firecracker: ${{ inputs.firecracker }}
          firecrackerImage: ${{ inputs.firecrackerImage }}
          sourcePane: ${{ inputs.sourcePane }}
          flowVersion: ${{ inputs.flowVersion }}
          testReturn: ${{ inputs.testReturn }}
          phase: prepare
          state:
            vmSync: ${{ data.latest(run.id + "-sync", "checkoutSync-current").attributes }}
            evidence: ${{ data.latest(run.id + "-inspect", "evidence-current").attributes }}
            review: ${{ inputs.state.review }}
            test: ${{ inputs.state.test }}
        invalidateChecks: false
    dependsOn:
    - step: diff-known
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "diff") }}
  - name: commit-prompt
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-commit-prompt" }}
      methodName: prepare_prompt
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        startup: true
        prompt: ${{ "Write a commit message for the pending changes in this checkout. Inspect the branch changes against local target branch "
          + inputs.targetBranch + ", including staged, unstaged and untracked files; use existing branch commits as context but describe the changes
          this new commit will contain. Leave files and Git state untouched. Do not commit, rebase, merge, remove resources or contact remotes.
          Return only JSON {\"message\":\"Descriptive subject\\n\\nExplanatory body\"}, without Markdown fences or commentary. Then exit." }}
    dependsOn:
    - step: diff-return
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "commit" && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && !data.latest(run.id
      + "-inspect", "evidence-current").attributes.source.clean) }}
  - name: commit-agent
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-commit-agent" }}
      methodName: agent_spawn
      globalArgs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
      inputs:
        session: ${{ inputs.session }}
        binary: ${{ inputs.binary }}
        work: ${{ inputs.launch }}
        key: ${{ run.id + "-commit-agent" }}
        waitForExit: true
        spec:
          kind: '${{ has(inputs.commitAgent.kind) ? inputs.commitAgent.kind : inputs.kind }}'
          command: '${{ has(inputs.commitAgent.command) ? inputs.commitAgent.command : size(inputs.commitAgent) == 0 ? inputs.agentCommand : ""
            }}'
          args: '${{ has(inputs.commitAgent.args) ? inputs.commitAgent.args : size(inputs.commitAgent) == 0 ? inputs.agentArgs : [] }}'
          model: '${{ has(inputs.commitAgent.model) ? inputs.commitAgent.model : "" }}'
          effort: '${{ has(inputs.commitAgent.effort) ? inputs.commitAgent.effort : "" }}'
          prompt: ${{ data.latest(run.id + "-commit-prompt", "prompt-current").attributes.prompt }}
          cwd: ${{ inputs.checkout }}
          source_directory: ${{ inputs.checkout }}
          reuse: true
    dependsOn:
    - step: commit-prompt
      condition:
        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase == "commit" && !data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && !data.latest(run.id
      + "-inspect", "evidence-current").attributes.source.clean) }}
  - name: commit-agent-exit
    task:
      type: model_method
      modelType: '@hammz/zellij'
      modelName: ${{ run.id + "-commit-agent-exit" }}
