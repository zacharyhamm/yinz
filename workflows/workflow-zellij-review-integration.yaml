        type: or
        conditions:
        - type: succeeded
        - type: skipped
    guard: ${{ !(inputs.phase in ["conflict", "resolved"] && data.latest(run.id + "-inspect", "evidence-current").attributes.source.rebasing && data.latest(run.id + "-inspect", "evidence-current").attributes.source.conflicts.size() == 0) }}
  - name: conflict-answer
    task:
      type: model_method
      modelType: "@hammz/question"
