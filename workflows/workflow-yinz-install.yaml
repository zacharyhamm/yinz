{
  "id": "6a5ac651-a2a4-4dde-88b1-ae56cb22b526",
  "name": "@hammz/yinz-install",
  "version": 1,
  "description": "Install a selected local checkout in a visible pane. The stable model instance serializes installs.",
  "inputs": {
    "type": "object",
    "properties": {
      "session": {
        "type": "string",
        "minLength": 1
      },
      "checkout": {
        "type": "string",
        "pattern": "^/"
      },
      "destination": {
        "type": "string"
      },
      "binary": {
        "type": "string",
        "default": "yinz"
      }
    },
    "required": [
      "session",
      "checkout"
    ]
  },
  "jobs": [
    {
      "name": "main",
      "steps": [
        {
          "name": "install",
          "task": {
            "type": "model_method",
            "modelType": "@hammz/yinz-install",
            "modelName": "yinz-install",
            "methodName": "run",
            "inputs": {
              "session": "${{ inputs.session }}",
              "checkout": "${{ inputs.checkout }}",
              "destination": "${{ has(inputs.destination) ? inputs.destination : null }}",
              "binary": "${{ inputs.binary }}"
            }
          }
        }
      ]
    }
  ]
}
