version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  # We want to be more sure in our e2e-test, before committing to
  # update all of our dependencies.
  # Only add packages very sporadically here for now.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"
    allow:
      # Allow only direct updates
      - dependency-name: "log"
  - package-ecosystem: "cargo"
    directory: "/yinz-runtime/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "log"
      - dependency-name: "log4rs"
  - package-ecosystem: "cargo"
    directory: "/yinz-cli/"
    schedule:
      interval: "monthly"
    allow:
      - dependency-name: "clap"
      - dependency-name: "clap_complete"
