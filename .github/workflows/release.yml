name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate release version
        shell: bash
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as manifest:
              version = tomllib.load(manifest)['workspace']['package']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Tag must match workspace version: v{version}')
          PY
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ca-certificates clang cmake curl git libssl-dev mold pkg-config protobuf-compiler python3 zlib1g-dev
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: brew install protobuf cmake
      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Test installer
        run: python3 -m unittest discover -s scripts/release/unit -v
      - name: Build
        run: cargo x build --release -- --locked
      - name: Package and verify installation
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: python3 scripts/release/package.py "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish complete release
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          test -f yinz-x86_64-unknown-linux-gnu.tar.gz
          test -f yinz-aarch64-unknown-linux-gnu.tar.gz
          test -f yinz-aarch64-apple-darwin.tar.gz
          sha256sum ./*.tar.gz > SHA256SUMS
          # Only a 404 means absent; authentication and network errors must fail.
          if gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > release.json 2> error.txt; then
            test "$(jq -r .draft release.json)" = true || { echo 'Release already published'; exit 1; }
          else
            grep -q 'HTTP 404' error.txt || { cat error.txt >&2; exit 1; }
            flags=()
            if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false
