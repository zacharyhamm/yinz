[package]
name = "zellij-pty"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The zellij server's pty thread: spawning and supervising pane processes over the bus"

[lints]
workspace = true

[dependencies]
zellij-bus = { path = "../zellij-bus", version = "0.45.0" }
zellij-runtime = { workspace = true }
zellij-session = { workspace = true }
zellij-types = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
zellij-ipc = { workspace = true }
zellij-storage = { workspace = true }
zellij-test-support = { path = "../zellij-test-support" }
async-trait = { version = "0.1.50", default-features = false }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
interprocess = { workspace = true }
