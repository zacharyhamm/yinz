[package]
name = "yinz-bus"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The yinz server's thread bus: instruction enums, senders, and the OS boundary's contract"

[lints]
workspace = true

[dependencies]
yinz-config = { workspace = true }
yinz-ipc = { workspace = true }
yinz-session = { workspace = true }
yinz-runtime = { workspace = true }
yinz-types = { workspace = true }
yinz-host-protocol = { workspace = true }
yinz-process-api = { workspace = true }
ansi_term = { workspace = true }
anyhow = { workspace = true }
async-trait = { version = "0.1.50", default-features = false }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
futures-lite = { workspace = true }
interprocess = { workspace = true }
isahc = { workspace = true }
log = { workspace = true }
once_cell = "1.19"
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
url = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
hegeltest = "0.29.3"
tempfile = "3.2.0"
tokio = { workspace = true, features = ["test-util"] }
yinz-test-support = { path = "../yinz-test-support" }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
