[package]
name = "zellij-tab"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The zellij server's tab: pane composition, focus, swap layouts, mouse and pane groups"

[lints]
workspace = true

[dependencies]
zellij-bus = { path = "../zellij-bus", version = "0.45.0" }
zellij-panes = { path = "../zellij-panes", version = "0.45.0" }
zellij-terminal = { path = "../zellij-terminal", version = "0.45.0" }
zellij-key-codec = { workspace = true }
zellij-runtime = { workspace = true }
zellij-types = { workspace = true }
anyhow = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
log = { workspace = true }
unicode-width = { workspace = true }
uuid = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
nix = { workspace = true, features = ["process", "signal"] }

[dev-dependencies]
zellij-config = { workspace = true }
zellij-ipc = { workspace = true }
hegeltest = "0.29.3"
insta = "1.48"
interprocess = { workspace = true }
kdl = { workspace = true }
tempfile = "3.2.0"
vte = { workspace = true }
