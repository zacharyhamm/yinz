[package]
name = "zellij-integration-tests"
description = "In-process whole-app integration test harness for Zellij"
publish = false
license.workspace = true
repository.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true


[lints]
workspace = true

[dependencies]
zellij-cli = { workspace = true }
zellij-config = { workspace = true }
zellij-ipc = { workspace = true }
zellij-session = { workspace = true }
zellij-types = { workspace = true }
zellij-runtime = { workspace = true }
# The kitty conformance suite's command builders and reply grammar, for `kitty_protocol`.
zellij-terminal-graphics = { workspace = true }
zellij-client = { path = "../zellij-client", version = "0.45.0" }
zellij-server = { path = "../zellij-server", version = "0.45.0" }
anyhow = { workspace = true }
async-trait = { workspace = true }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
interprocess = { workspace = true }
insta = "1.48"
log = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
vte = { workspace = true }

[dev-dependencies]
zellij-deno-builtins = { workspace = true }
zellij-test-support = { path = "../zellij-test-support" }
base64 = { version = "0.22", default-features = false, features = ["std"] }
tempfile = { workspace = true }
serde_json = { workspace = true }
# Unused in code. `x integration-test` builds the zellij binary first, and the root package's
# default `vendored_curl` links libcurl statically. Asking for it here too tests the libcurl the
# binary ships and lets the suite reuse that build of libcurl, OpenSSL and every crate above them.
openssl-sys = { workspace = true }
curl-sys = { workspace = true, features = ["static-curl"] }
