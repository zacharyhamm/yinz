[package]
name = "yinz-plugin-host"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The yinz server's plugin host: Wasm and Deno plugin loading, execution, and job queues"

[lints]
workspace = true

[dependencies]
agent-proto = { path = "../default-plugins/agent-proto" }
project-data = { path = "../default-plugins/project-data" }
yinz-terminal = { path = "../yinz-terminal", version = "0.1.0" }
vte = { workspace = true }
yinz-routing = { path = "../yinz-routing", version = "0.1.0" }
yinz-bus = { path = "../yinz-bus", version = "0.1.0" }
yinz-config = { workspace = true }
yinz-deno-builtins = { workspace = true }
yinz-ipc = { workspace = true }
yinz-key-codec = { workspace = true }
yinz-plugin-api = { workspace = true }
yinz-plugin-authoring = { workspace = true }
yinz-session = { workspace = true }
yinz-storage = { workspace = true }
yinz-runtime = { workspace = true }
yinz-types = { workspace = true }
yinz-process = { path = "../yinz-process", version = "0.1.0" }
yinz-tile = { path = "../yinz-tile" }
yinz-tile-markdown = { path = "../yinz-tile-markdown" }
anyhow = { workspace = true }
chrono = { workspace = true }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
deno_core = "=0.405.0"
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_error = "0.7"
kdl = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
notify-debouncer-full = { workspace = true }
num_cpus = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
wasmi_wasi = { version = "1.1.0" }

[dependencies.wasmi]
version = "1.1.0"
default-features = false
features = ["std"]

# For `LimiterError`, which `ResourceLimiter` returns but `wasmi` does not re-export.
[dependencies.wasmi_core]
version = "1.1.0"
default-features = false
features = ["std"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
close_fds = "0.3.2"
nix = { workspace = true, features = ["fs", "hostname", "poll", "process", "signal", "socket", "term", "uio", "user"] }

[dev-dependencies]
regex = { workspace = true }
hegeltest = "0.29.3"
insta = "1.48"
# The plugin tests share process-global state (`YINZ_SESSION_NAME` and the directories derived
# from it), so they are serialized against each other with `#[serial(plugin_tests)]`. Only that
# group is serialized; the rest of the crate's tests still run in parallel alongside it.
serial_test = "3.0"
tempfile = "3.2.0"
tokio = { workspace = true, features = ["test-util"] }
wasmi = { version = "1.1.0", features = ["std"] }
yinz-test-support = { path = "../yinz-test-support" }
