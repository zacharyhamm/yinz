[package]
name = "zellij-utils"
version.workspace = true
authors = ["Kunal Mohan <kunalmohan99@gmail.com>"]
edition.workspace = true
description = "A utility library for Zellij client and server"
license.workspace = true
include = ["src/**/*", "assets/", "!assets/plugins/*.wasm"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
backtrace = { version = "0.3.55", default-features = false, features = ["std"] }
bitflags = { version = "2.5.0", default-features = false }
clap = { workspace = true }
clap_complete = { version = "4.6", default-features = false }
colored = { version = "3.1", default-features = false }
colorsys = { version = "0.6.5", default-features = false, features = ["std"] }
crossbeam = { version = "0.8.1", default-features = false, features = ["alloc", "std"] }
directories = { version = "6.0", default-features = false }
include_dir = { version = "0.7.3", default-features = false }
kdl = { version = "4.5.0", default-features = false, features = ["span"] }
lazy_static = { workspace = true }
log = { workspace = true }
miette = { workspace = true }
percent-encoding = { version = "2.1.0", default-features = false, features = ["std"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { version = "3.0.0", default-features = false, features = ["base-0", "tilde"] }
strip-ansi-escapes = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
sha2 = { workspace = true }
libc = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
tokio = { workspace = true }
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7", default-features = false, features = ["compat", "io"] }
log4rs = { version = "1.2.0", default-features = false, features = ["pattern_encoder", "rolling_file_appender", "compound_policy", "fixed_window_roller", "size_trigger"] }
interprocess = { workspace = true }
openssl-sys = { version = "0.9.93", default-features = false, features = ["vendored"], optional = true }
isahc = { workspace = true }
curl-sys = { version = "0.4", default-features = false, features = ["force-system-lib-on-osx", "ssl"], optional = true }
humantime = { workspace = true }
suggest = { workspace = true }
names = { workspace = true }
rusqlite = { version = "0.30", default-features = false, features = ["bundled"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }
bytes = { version = "1", default-features = false }
notify = { workspace = true }
mlua = { workspace = true }
vte = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["user", "term"] }

[dev-dependencies]
postgres = { version = "0.19", default-features = false }
insta = "1.48"
expect-test = "1.4.1"
hegeltest = "0.29.3"

[features]
unstable = []
# The plugin-data store suite against a real Postgres, run by `cargo x postgres-test`. Off by
# default so `cargo x test` never needs docker; `cargo x lint --all-features` still compiles it.
postgres-tests = []
vendored_curl = ["isahc/static-curl", "dep:openssl-sys", "dep:curl-sys"]
