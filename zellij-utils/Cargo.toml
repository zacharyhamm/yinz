[package]
name = "zellij-utils"
version.workspace = true
authors = ["Kunal Mohan <kunalmohan99@gmail.com>"]
edition.workspace = true
description = "A utility library for Zellij client and server"
license.workspace = true
include = ["src/**/*", "assets/", "!assets/plugins/*.wasm"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lints]
workspace = true

[dependencies]
zellij-types = { workspace = true }
zellij-runtime = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
clap_complete = { version = "4.6", default-features = false }
colored = { version = "3.1", default-features = false }
include_dir = { version = "0.7.3", default-features = false }
kdl = { version = "4.5.0", default-features = false, features = ["span"] }
lazy_static = { workspace = true }
log = { workspace = true }
miette = { workspace = true }
percent-encoding = { version = "2.1.0", default-features = false, features = ["std"] }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { version = "3.0.0", default-features = false, features = ["base-0", "tilde"] }
strip-ansi-escapes = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
libc = { workspace = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
tokio = { workspace = true }
interprocess = { workspace = true }
humantime = { workspace = true }
suggest = { workspace = true }
names = { workspace = true }
notify = { workspace = true }
mlua = { workspace = true }

[dev-dependencies]
directories = { version = "6.0", default-features = false }
insta = "1.48"
expect-test = "1.4.1"
hegeltest = "0.29.3"

[features]
unstable = []
