[package]
name = "yinz-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Host facilities for Yinz"

[lints]
workspace = true

[dependencies]
jiff = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
serde_json = { workspace = true }
libc = { workspace = true }
shellexpand = { version = "3.0.0", default-features = false, features = ["base-0", "tilde"] }
miette = { workspace = true }
yinz-types = { workspace = true }
yinz-plugin-location = { workspace = true }
tempfile = { workspace = true }
anyhow = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
backtrace = { version = "0.3.55", default-features = false, features = ["std"] }
colored = { version = "3.1", default-features = false }
crossbeam = { version = "0.8.1", default-features = false, features = ["alloc", "std"] }
directories = { version = "6.0", default-features = false }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true }
log4rs = { version = "1.2.0", default-features = false, features = ["pattern_encoder", "rolling_file_appender", "compound_policy", "fixed_window_roller", "size_trigger"] }

[dev-dependencies]
tempfile = { workspace = true }
hegeltest = "0.29.3"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
nix = { workspace = true, features = ["hostname", "user", "term"] }
