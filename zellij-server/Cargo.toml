[package]
name = "zellij-server"
version.workspace = true
authors = ["Kunal Mohan <kunalmohan99@gmail.com>"]
edition.workspace = true
description = "The server-side library for Zellij"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lints]
workspace = true

[dependencies]
zellij-cli = { workspace = true }
zellij-config = { workspace = true }
zellij-ipc = { workspace = true }
zellij-plugin-api = { workspace = true }
zellij-session = { workspace = true }
zellij-storage = { workspace = true }
zellij-runtime = { workspace = true }
zellij-types = { workspace = true }
zellij-bus = { path = "../zellij-bus", version = "0.45.0" }
zellij-terminal = { path = "../zellij-terminal", version = "0.45.0" }
zellij-process = { path = "../zellij-process", version = "0.45.0" }
zellij-tile = { path = "../zellij-tile" }
zellij-tile-markdown = { path = "../zellij-tile-markdown" }
ansi_term = { workspace = true }
anyhow = { workspace = true }
async-trait = { version = "0.1.50", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
bytes = { version = "1.6.0", default-features = false, features = ["std"] }
chrono = { workspace = true }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
highway = { version = "=1.2.0", default-features = false, features = ["std"] }
interprocess = { workspace = true }
kasuari = { version = "0.4.12", default-features = false }
kdl = { workspace = true }
log = { workspace = true }
mlua = { workspace = true }
notify-debouncer-full = { workspace = true }
prost = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vte = { workspace = true }
wasmi_wasi = { version = "1.1.0" }
# For `ellipsize`, shared with the tab bars so the two ends of a lent pane title agree on how a
# title is cut. The crate is leaf-level (ansi_term and unicode-width only), so this is acyclic.
zellij-tile-utils = { path = "../zellij-tile-utils" }
num_cpus = { workspace = true }

[dependencies.wasmi]
version = "1.1.0"
default-features = false
features = ["std"]

# For `LimiterError`, which `ResourceLimiter` returns but `wasmi` does not re-export.
[dependencies.wasmi_core]
version = "1.1.0"
default-features = false
features = ["std"]

[target.'cfg(unix)'.dependencies]
daemonize = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["fs", "hostname", "poll", "process", "signal", "socket", "term", "uio", "user"] }

[dev-dependencies]
lazy_static = { workspace = true }
hocus-proto = { path = "../default-plugins/hocus-proto" }
png = { version = "0.17.16", default-features = false }
criterion = { workspace = true }
hegeltest = "0.29.3"
tokio = { workspace = true, features = ["sync", "test-util"] }
zellij-test-support = { path = "../zellij-test-support" }
insta = "1.48"
# The plugin tests share process-global state (`ZELLIJ_SESSION_NAME` and the directories derived
# from it), so they are serialized against each other with `#[serial(plugin_tests)]`. Only that
# group is serialized; the rest of the crate's tests still run in parallel alongside it.
serial_test = "3.0"
tempfile = "3.2.0"
wasmi = { version = "1.1.0", features = ["std"] }

# `test = false` keeps `cargo test` (and therefore `cargo x test`) from building and running the
# bench binary in test mode, which would slow the test command down for no coverage gain.
[[bench]]
name = "multi_pane_render"
harness = false
test = false
