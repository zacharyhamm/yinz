[package]
name = "zellij-server"
version.workspace = true
authors = ["Kunal Mohan <kunalmohan99@gmail.com>"]
edition.workspace = true
description = "The server-side library for Zellij"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ansi_term = { workspace = true }
anyhow = { workspace = true }
arrayvec = { version = "0.7.2", default-features = false, features = ["std"] }
async-trait = { version = "0.1.50", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
byteorder = { version = "1.4.3", default-features = false, features = ["std"] }
bytes = { version = "1.6.0", default-features = false, features = ["std"] }
chrono = { workspace = true }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
futures-lite = { workspace = true }
highway = { version = "=1.2.0", default-features = false, features = ["std"] }
interprocess = { workspace = true }
isahc = { workspace = true }
kasuari = { version = "0.4.12", default-features = false }
kdl = { workspace = true }
lazy_static = { workspace = true }
log = { workspace = true }
mlua = { workspace = true }
notify-debouncer-full = { workspace = true }
png = { version = "0.17.16", default-features = false }
prost = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sixel-image = { version = "0.2.1", default-features = false }
sixel-tokenizer = { version = "0.1.0", default-features = false }
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }
tempfile = { workspace = true }
tokio = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
vte = { workspace = true }
wasmi_wasi = { version = "1.1.0" }
zellij-utils = { workspace = true }
once_cell = "1.19"
num_cpus = { workspace = true }

[dependencies.wasmi]
version = "1.1.0"
default-features = false
features = ["std"]

# For `LimiterError`, which `ResourceLimiter` returns but `wasmi` does not re-export.
[dependencies.wasmi_core]
version = "1.1.0"
default-features = false
features = ["std"]

[target.'cfg(unix)'.dependencies]
close_fds = "0.3.2"
daemonize = { workspace = true }
libc = { workspace = true }
nix = { workspace = true, features = ["fs", "hostname", "poll", "process", "signal", "socket", "term", "uio", "user"] }
signal-hook = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }
hegeltest = "0.29.3"
zellij-test-support = { path = "../zellij-test-support" }
insta = "1.48"
# The plugin tests share process-global state (`ZELLIJ_SESSION_NAME` and the directories derived
# from it), so they are serialized against each other with `#[serial(plugin_tests)]`. Only that
# group is serialized; the rest of the crate's tests still run in parallel alongside it.
serial_test = "3.0"
tempfile = "3.2.0"
wasmi = { version = "1.1.0", features = ["std"] }
rusqlite = { version = "0.30", default-features = false, features = ["bundled"] }

[features]
web_server_capability = ["zellij-utils/web_server_capability"]

# `test = false` keeps `cargo test` (and therefore `cargo x test`) from building and running the
# bench binary in test mode, which would slow the test command down for no coverage gain.
[[bench]]
name = "multi_pane_render"
harness = false
test = false
