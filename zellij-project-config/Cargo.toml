[package]
name = "zellij-project-config"
description = "Project workflow settings read from .zellij/swamp-workflows.kdl"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
zellij-types = { workspace = true }
zellij-runtime = { workspace = true }
kdl = { workspace = true }
serde = { workspace = true }

# Only the host-side readers and writers touch the filesystem; `parse` and the types also build
# for the wasm plugins through zellij-tile.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
