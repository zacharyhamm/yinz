[package]
name = "hocus"
version = "0.1.0"
edition.workspace = true


[lib]
name = "hocus"
path = "src/lib.rs"

[[bin]]
name = "hocus"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
zellij-tile = { path = "../../zellij-tile" }
hocus-proto = { path = "../hocus-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }
pulldown-cmark = { version = "0.13.4", default-features = false }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "transcript"
harness = false
test = false
