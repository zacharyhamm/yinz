[package]
name = "hocus"
version = "0.1.0"
edition.workspace = true


[lib]
name = "hocus"
path = "src/lib.rs"

[[bin]]
name = "hocus"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
zellij-plugin-api = { workspace = true }
zellij-runtime = { workspace = true }
zellij-types = { workspace = true }
zellij-tile = { path = "../../zellij-tile" }
hocus-proto = { path = "../hocus-proto" }
serde = { workspace = true }
serde_json = { workspace = true }
# Already built for wasm32-wasip1 by status-bar, so this is link size rather than a new crate.
# `unicode-case` because the workspace pin turns Unicode off, and without it `(?i)` is a build
# error for every pattern, ASCII included.
regex = { workspace = true, features = ["unicode-case"] }
unicode-width = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zellij-plugin-host = { path = "../../zellij-plugin-host" }
tempfile = { workspace = true }
# The Jev calibration harness posts real Decisions requests; see unit/main_tests/jev_calibration.rs.
isahc = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "transcript"
harness = false
test = false
