[package]
name = "hocus-proto"
version = "0.1.0"
edition.workspace = true


[lints]
workspace = true

[dependencies]
zellij-tile = { path = "../../zellij-tile" }
# The markdown the agents pane and the conversation both draw. Moved here from
# `hocus` when the renderer above it was: one dialect, read one way.
pulldown-cmark = { version = "0.13.4", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }

# The store engine, for `store::Local`. Not a dev-dependency: the crates that
# link this one test against `Local` too, and a dev-dependency would not reach
# them. Target-gated because `plugin_data_store` and `rusqlite` do not build for
# wasm — which is the same reason the plugins get `store::Host` instead.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
zellij-utils = { workspace = true }
tempfile = { workspace = true }
