[package]
name = "hocus-agentd"
version = "0.1.0"
edition.workspace = true


[lints]
workspace = true

[dependencies]
zellij-tile = { path = "../../zellij-tile" }
# Already built for wasm through zellij-tile; only for the transport frame limit.
zellij-runtime = { workspace = true }
prost = { workspace = true }
hocus-proto = { path = "../hocus-proto" }
serde = { workspace = true }
serde_json = { workspace = true }

# Only the tests hold the completion frame size to the real transport contract; the plugin
# computes it itself, so the wasm build does not compile zellij-ipc.
[dev-dependencies]
zellij-ipc = { workspace = true }
