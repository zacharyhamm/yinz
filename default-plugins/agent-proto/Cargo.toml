[package]
name = "agent-proto"
version = "0.1.0"
edition.workspace = true


[lints]
workspace = true

[dependencies]
# The pure store seam, schemas and project registry, re-exported unchanged.
project-data = { path = "../project-data" }
yinz-types = { workspace = true }
yinz-tile = { path = "../../yinz-tile" }
yinz-tile-utils = { path = "../../yinz-tile-utils" }
yinz-tile-markdown = { path = "../../yinz-tile-markdown" }
serde = { workspace = true }
serde_json = { workspace = true }
unicode-width = { workspace = true }
url = { workspace = true }
regex = { workspace = true, features = ["unicode-case"] }

anyhow = { workspace = true }
png = { version = "0.17.16", default-features = false }

[dev-dependencies]
project-data = { path = "../project-data", features = ["test-support"] }
