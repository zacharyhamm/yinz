[package]
name = "yinz-swamp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Managed local Swamp servers and the workflow client Yinz multiplexes over them"

[lints]
workspace = true

[dependencies]
yinz-project-config = { workspace = true }
yinz-runtime = { workspace = true }
anyhow = { workspace = true }
close_fds = "0.3.2"
futures-util = { version = "0.3", features = ["sink"] }
isahc = { workspace = true }
libc = { workspace = true }
log = { workspace = true }
nix = { workspace = true, features = ["process", "signal", "user"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { version = "0.0.28", default-features = false, features = ["deserialize"] }
sha2 = { workspace = true }
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-native-tls = "0.3"
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
uuid = { workspace = true }

[dev-dependencies]
yinz-test-support = { path = "../yinz-test-support" }
