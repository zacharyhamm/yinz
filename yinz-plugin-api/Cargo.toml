[package]
name = "yinz-plugin-api"
description = "Yinz plugin protocol and authoring tools"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[features]
test-support = ["dep:hegeltest", "yinz-types/test-support"]

[dependencies]
yinz-plugin-authoring = { workspace = true }
hegeltest = { version = "0.29.3", optional = true }
yinz-types = { workspace = true }
yinz-plugin-location = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
strum = { workspace = true }
strum_macros = { workspace = true }
log = { workspace = true }
[dev-dependencies]
yinz-types = { workspace = true, features = ["test-support"] }
hegeltest = "0.29.3"
