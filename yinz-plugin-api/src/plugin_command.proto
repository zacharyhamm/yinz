// ---------------------------------------------------------------- data store
//
// The types these carry live in `plugin_data.proto`, because `event.proto` needs
// `Rows` for the change notification and this file already imports `event.proto`,
// so declaring them in either one would make the imports circular.

message DataDefineEntityPayload {
  optional string namespace = 1;
  plugin_data.EntityDef def = 2;
  bool allow_destructive = 3;
}

message DataApplyPayload {
  optional string namespace = 1;
  repeated plugin_data.Mutation mutations = 2;
}

message DataFetchPayload {
  plugin_data.FetchRequest request = 1;
}

message DataWatchPayload {
  plugin_data.FetchRequest request = 1;
  plugin_data.WatchMode mode = 2;
}

message DataUnwatchPayload {
  uint64 watch_id = 1;
}

// An absent namespace asks for every namespace the plugin may see, not for its own.
message DataCatalogPayload {
  optional string namespace = 1;
}

// The instant the offset is wanted for, rather than "now": a run that began before
// a daylight-saving change is read back with the offset that was in force then.
message GetLocalUtcOffsetPayload {
  int64 epoch_ms = 1;
}

// Seconds east of UTC. Signed, and half the planet's is negative, so zigzag rather
// than a two's-complement varint ten bytes long.
message GetLocalTimeResponse {
  string text = 1;
}

message GetLocalUtcOffsetResponse {
  sint32 offset_seconds = 1;
}

message SetPaneTitlePrefixPayload {
  PaneId pane_id = 1;
  // Absent drops the prefix.
  optional string prefix = 2;
}
message SetPaneSubtitlePayload {
  PaneId pane_id = 1;
  // Absent drops the subtitle.
  optional string subtitle = 2;
}

message DataDefineResponse {
  oneof result {
    plugin_data.SchemaInfo info = 1;
    string error = 2;
  }
}

message DataApplyResponse {
  oneof result {
    plugin_data.ApplyReport report = 1;
    string error = 2;
    // A write guarded with `expect_rev` found the row at another revision, or gone. Its own
    // branch rather than a flag on `error`, so a caller can tell "re-read and try again" from
    // "this will not work" without reading the message. Only a plugin that sends a guard can
    // ever be answered with one, so an older plugin never sees this branch.
    string conflict = 3;
  }
}

message DataFetchResponse {
  oneof result {
    plugin_data.Rows rows = 1;
    string error = 2;
  }
}

message DataCountResponse {
  oneof result {
    uint64 count = 1;
    string error = 2;
  }
}

message DataWatchResponse {
  oneof result {
    plugin_data.WatchHandle handle = 1;
    string error = 2;
  }
}

message DataUnwatchResponse {
  oneof result {
    bool ok = 1;
    string error = 2;
  }
}

// A oneof cannot hold a repeated field, so the entities are wrapped.
message DataEntityList {
  repeated plugin_data.EntityInfo entities = 1;
}

message DataCatalogResponse {
  oneof result {
    DataEntityList entities = 1;
    string error = 2;
  }
}

// Where a warped pane lands in the session receiving it.
//
// Values are prefixed because proto3 scopes enum values to the package, and
// `CommandName` in this same file already has a `NewTab`.
enum WarpPlacement {
  WarpPlacementNewTab = 0;
  WarpPlacementFocusedTab = 1;
  WarpPlacementFloating = 2;
}

message WarpPaneToSessionPayload {
  PaneId pane_id = 1;
  string to_session = 2;
  WarpPlacement placement = 3;
}

