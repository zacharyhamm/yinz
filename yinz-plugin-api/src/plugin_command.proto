    string error = 2;
  }
}

// A pane supervisor that outlived the session it belonged to.
//
// `exit_code` is meaningful only when `exited` is set, and its absence then
// means the child was killed by a signal rather than exiting with a status.
message OrphanedPane {
  string host_id = 1;
  optional string session_name = 2;
  string command = 3;
  optional string cwd = 4;
  optional uint32 child_pid = 5;
  uint64 started_at_unix = 6;
  bool exited = 7;
  optional int32 exit_code = 8;
  uint64 buffered_bytes = 9;
}

