// The KDL configuration block declared for one plugin alias, so a plugin can
// read settings a *different* plugin was configured with. An unknown alias is
// answered with an empty configuration rather than an error - "nothing is
// configured under that name" is the same answer either way, and a plugin has
// nothing useful to do with the difference.
message GetPluginAliasConfigurationPayload {
  string alias = 1;
}

message GetPluginAliasConfigurationResponse {
  map<string, string> configuration = 1;
}

