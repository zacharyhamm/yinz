syntax = "proto3";

package api.command;

message Command {
  string path = 1;
  repeated string args = 2;
  optional string cwd = 3;
  // Legacy SSH spelling; writers fill both this and target.
  optional string remote_host = 4;
  bool remote_default_shell = 5;
  // Decode-only markers: reject retired execution requests.
  optional string firecracker_vm = 6;
  optional string firecracker_image = 7;
  optional string firecracker_worktree = 8;
  optional PaneTarget target = 9;
}

// Where a pane's process runs; unset or `local` means this machine.
message PaneTarget {
  // Outside the oneof so a local/SSH target cannot hide a retired VM request.
  optional bytes firecracker = 3;
  oneof kind {
    bool local = 1;
    string ssh_host = 2;
    // This machine, inside the Bubblewrap environment of the primary checkout at this path.
    string bubblewrap_root = 4;
  }
}
