syntax = "proto3";

import "input_mode.proto";
import "key.proto";
import "style.proto";
import "action.proto";
import "plugin_data.proto";
import "command.proto";

package api.event;

enum EventType {
    reserved 31, 34, 43, 47, 64;
    /// The input mode or relevant metadata changed
    ModeUpdate = 0;
    /// The tab state in the app was changed
    TabUpdate = 1;
    /// The pane state in the app was changed
    PaneUpdate = 2;
    /// A key was pressed while the user is focused on this plugin's pane
    Key = 3;
    /// A mouse event happened while the user is focused on this plugin's pane
    Mouse = 4;
    /// A timer expired set by the `set_timeout` method exported by `yinz-tile`.
    Timer = 5;
    /// Text was copied to the clipboard anywhere in the app
    CopyToClipboard = 6;
    /// Failed to copy text to clipboard anywhere in the app
    SystemClipboardFailure = 7;
    /// Input was received anywhere in the app
    InputReceived = 8;
    /// This plugin became visible or invisible
    Visible = 9;
    /// A message from one of the plugin's workers
    CustomMessage = 10;
    /// A file was created somewhere in the Yinz CWD folder
    FileSystemCreate = 11;
    /// A file was accessed somewhere in the Yinz CWD folder
    FileSystemRead = 12;
    /// A file was modified somewhere in the Yinz CWD folder
    FileSystemUpdate = 13;
    /// A file was deleted somewhere in the Yinz CWD folder
    FileSystemDelete = 14;
    PermissionRequestResult = 15;
    SessionUpdate = 16;
    RunCommandResult = 17;
    WebRequestResult = 18;
    CommandPaneOpened = 19;
    CommandPaneExited = 20;
    PaneClosed = 21;
    EditPaneOpened = 22;
    EditPaneExited = 23;
    CommandPaneReRun = 24;
    FailedToWriteConfigToDisk = 25;
    ListClients = 26;
    HostFolderChanged = 27;
    FailedToChangeHostFolder = 28;
    PastedText = 29;
    ConfigWasWrittenToDisk = 30;
    BeforeClose = 32;
    InterceptedKeyPress = 35;
    PaneRenderReport = 36;
    UserAction = 37;
    ActionComplete = 38;
    CwdChanged = 39;
    AvailableLayoutInfo = 40;
    PluginConfigurationChanged = 41;
    HighlightClicked = 42;
    InitialKeybinds = 44;
    CommandChanged = 45;
    HostTerminalThemeChanged = 46;
    HintText = 48;
    ActivePaneScroll = 49;
    WebRequestStreamChunk = 50;
    /// The results of a watch registered with `data_watch` changed
    PluginDataChanged = 51;
    /// A job this plugin enqueued on a work queue started running
    QueueJobStarted = 52;
    /// A job this plugin enqueued on a work queue finished
    QueueJobFinished = 53;
    /// A work queue's contents or concurrency changed
    QueueChanged = 54;
    /// A right-click asked for a context menu
    ContextMenuRequested = 55;
    /// A plugin-supplied context menu item was chosen
    ContextMenuItemSelected = 56;
    /// A headless hook point was reached; sent to the plugin bound to it
    Hook = 57;
    AgentEvent = 58;
    /// Which modifier keys the client believes are held right now
    ModifiersHeld = 59;
    RunCommandOutput = 60;
    PaneOutput = 61;
    PaneTabsUpdate = 62;
    AgentProvidersChanged = 63;
    ProjectProvidersChanged = 70;
    PickResult = 68;
    CellPixelSizeChanged = 69;
    NotificationReceived = 65;
    NotificationRequested = 66;
    NotificationResolved = 67;
}

message EventNameList {
  repeated EventType event_types = 1;
}

message Event {
  reserved 27, 28, 37, 41, 61;
  EventType name = 1;
  oneof payload {
    string pane_tabs_update_payload = 59;
    string agent_providers_changed_payload = 60;
    string project_providers_changed_payload = 67;
    string pick_result_payload = 65;
    CellPixelSizeChangedPayload cell_pixel_size_changed_payload = 66;
    ModeUpdatePayload mode_update_payload = 2;
    TabUpdatePayload tab_update_payload = 3;
    PaneUpdatePayload pane_update_payload = 4;
    key.Key key_payload = 5;
    MouseEventPayload mouse_event_payload = 6;
    float timer_payload = 7;
    CopyDestination copy_to_clipboard_payload = 8;
    bool visible_payload = 9;
    CustomMessagePayload custom_message_payload = 10;
    FileListPayload file_list_payload = 11;
    PermissionRequestResultPayload permission_request_result_payload = 12;
    SessionUpdatePayload session_update_payload = 13;
    RunCommandResultPayload run_command_result_payload = 14;
    WebRequestResultPayload web_request_result_payload = 15;
    CommandPaneOpenedPayload command_pane_opened_payload = 16;
    CommandPaneExitedPayload command_pane_exited_payload = 17;
    PaneClosedPayload pane_closed_payload = 18;
    EditPaneOpenedPayload edit_pane_opened_payload = 19;
    EditPaneExitedPayload edit_pane_exited_payload = 20;
    CommandPaneReRunPayload command_pane_rerun_payload = 21;
    FailedToWriteConfigToDiskPayload failed_to_write_config_to_disk_payload = 22;
    ListClientsPayload list_clients_payload = 23;
    HostFolderChangedPayload host_folder_changed_payload = 24;
    FailedToChangeHostFolderPayload failed_to_change_host_folder_payload = 25;
    PastedTextPayload pasted_text_payload = 26;
    key.Key intercepted_key_payload = 29;
    PaneRenderReportPayload pane_render_report_payload = 30;
    UserActionPayload user_action_payload = 31;
    ActionCompletePayload action_complete_payload = 32;
    CwdChangedPayload cwd_changed_payload = 33;
    AvailableLayoutInfoPayload available_layout_info_payload = 34;
    PluginConfigurationChangedPayload plugin_configuration_changed_payload = 35;
    HighlightClickedPayload highlight_clicked_payload = 36;
    InitialKeybindsPayload initial_keybinds_payload = 38;
    CommandChangedPayload command_changed_payload = 39;
    HostTerminalThemeChangedPayload host_terminal_theme_changed_payload = 40;
    HintTextPayload hint_text_payload = 42;
    ActivePaneScrollPayload active_pane_scroll_payload = 43;
    WebRequestStreamChunkPayload web_request_stream_chunk_payload = 44;
    PluginDataChangedPayload plugin_data_changed_payload = 45;
    QueueJobStartedPayload queue_job_started_payload = 46;
    QueueJobFinishedPayload queue_job_finished_payload = 47;
    QueueChangedPayload queue_changed_payload = 48;
    ContextMenuRequestedPayload context_menu_requested_payload = 49;
    ContextMenuItemSelectedPayload context_menu_item_selected_payload = 50;
    HookPayload hook_payload = 51;
    AgentEventPayload agent_event_payload = 52;
    ModifiersHeldPayload modifiers_held_payload = 53;
    RunCommandOutputPayload run_command_output_payload = 54;
    PaneOutputPayload pane_output_payload = 55;
    string notification_received_payload = 62;
    string notification_requested_payload = 63;
    string notification_resolved_payload = 64;
  }
}

message PaneOutputPayload {
  uint32 pane_id = 1;
  bytes data = 2;
  repeated ContextItem context = 3;
}

message RunCommandOutputPayload {
  bytes data = 1;
  bool stderr = 2;
  repeated ContextItem context = 3;
}

message ModifiersHeldPayload {
  repeated api.key.Key.KeyModifier modifiers = 1;
  // Whether the terminal reported the modifier key itself going down (and will report it
  // coming back up), or this was inferred from a chorded keystroke and no release will follow.
  bool is_live = 2;
}

message HookPayload {
  // The point's snake_case name, as `hooks { }` spells it
  string point = 1;
  oneof payload {
    AgentHookPayload agent = 3;
    PaneExitHookPayload pane_exit = 4;
    SessionStartHookPayload session_start = 5;
  }
}

message AgentHookPayload {
  uint32 pane_id = 1;
  AgentInfo agent = 2;
  // `AgentState`'s own spelling; absent for a record that just appeared.
  optional string previous_state = 3;
  optional string command = 4;
}

message PaneExitHookPayload {
  uint32 pane_id = 1;
  optional int32 exit_code = 2;
  optional string cwd = 3;
  optional string command = 4;
  bool held = 5;
}

message SessionStartHookPayload {
  string session_name = 1;
  uint32 client_id = 2;
}

// Mirrors `yinz_types::agent::AgentEvent`.
message AgentEventPayload {
  uint32 pane_id = 1;
  string kind = 2;
  string hook = 3;
  optional string session_id = 4;
  // `AgentState`'s own spelling: Busy, Waiting, Idle, Exited. Absent when the event says nothing.
  optional string state = 5;
  optional string detail = 6;
  optional string prompt = 7;
  optional string last_message = 8;
  optional string tool_name = 9;
  optional string cwd = 10;
  string raw = 11;
}

enum QueueJobOutcome {
  Succeeded = 0;
  Failed = 1;
  Cancelled = 2;
  Aborted = 3;
}

enum QueueJobState {
  Pending = 0;
  Running = 1;
}

message QueueJobInfo {
  uint64 job_id = 1;
  string queue = 2;
  string plugin_url = 3;
  optional uint32 plugin_id = 4;
  uint32 enqueuer_plugin_id = 5;
  repeated ContextItem context = 6;
  QueueJobState state = 7;
}

message QueueSnapshot {
  string queue = 1;
  uint32 concurrency = 2;
  repeated QueueJobInfo pending = 3;
  repeated QueueJobInfo running = 4;
}

message QueueJobStartedPayload {
  string queue = 1;
  uint64 job_id = 2;
  uint32 plugin_id = 3;
  repeated ContextItem context = 4;
}

message QueueJobFinishedPayload {
  string queue = 1;
  uint64 job_id = 2;
  QueueJobOutcome outcome = 3;
  optional string payload = 4;
  repeated ContextItem context = 5;
}

message QueueChangedPayload {
  string queue = 1;
  uint32 concurrency = 2;
  repeated QueueJobInfo pending = 3;
  repeated QueueJobInfo running = 4;
}

message HintTextPayload {
  map<uint32, StyledText> hint_text = 1;
}

message PluginDataChangedPayload {
  uint64 watch_id = 1;
  plugin_data.Rows rows = 2;
  bool truncated = 3;
}

message ActivePaneScrollPayload {
  optional uint32 position = 1;
  optional uint32 length = 2;
}

message StyledText {
  string text = 1;
  repeated StyledTextIndices indices = 2;
}

message StyledTextIndices {
  repeated uint32 indices = 1;
}

message HostTerminalThemeChangedPayload {
  HostTerminalThemeIndication mode = 1;
}

enum HostTerminalThemeIndication {
  Dark = 0;
  Light = 1;
}

message CwdChangedPayload {
  PaneId pane_id = 1;
  string new_cwd = 2;
  repeated uint32 focused_client_ids = 3;
}

message CommandChangedPayload {
  PaneId pane_id = 1;
  repeated string command = 2;
  bool is_foreground = 3;
  repeated uint32 focused_client_ids = 4;
}

message PastedTextPayload {
  string pasted_text = 1;
}

message FailedToChangeHostFolderPayload {
  optional string error_message = 1;
}

message HostFolderChangedPayload {
  string new_host_folder_path = 1;
}

message ListClientsPayload {
  repeated ClientInfo client_info = 1;
}

message ClientInfo {
  uint32 client_id = 1;
  PaneId pane_id = 2;
  string running_command = 3;
  bool is_current_client = 4;
}

message FailedToWriteConfigToDiskPayload {
  optional string file_path = 1;
  optional string reason = 2;
}

message CommandPaneReRunPayload {
  uint32 terminal_pane_id = 1;
  repeated ContextItem context = 3;
}

message PaneClosedPayload {
  PaneId pane_id = 1;
}

// duplicate of plugin_command.PaneId because protobuffs don't like recursive imports
message PaneId {
  PaneType pane_type = 1;
  uint32 id = 2;
}

// duplicate of plugin_command.PaneType because protobuffs don't like recursive imports
enum PaneType {
  Terminal = 0;
  Plugin = 1;
}

message CommandPaneOpenedPayload {
  uint32 terminal_pane_id = 1;
  repeated ContextItem context = 2;
}

message EditPaneOpenedPayload {
  uint32 terminal_pane_id = 1;
  repeated ContextItem context = 2;
}

message CommandPaneExitedPayload {
  uint32 terminal_pane_id = 1;
  optional int32 exit_code = 2;
  repeated ContextItem context = 3;
}

message EditPaneExitedPayload {
  uint32 terminal_pane_id = 1;
  optional int32 exit_code = 2;
  repeated ContextItem context = 3;
}

message SessionUpdatePayload {
  repeated SessionManifest session_manifests = 1;
  repeated ResurrectableSession resurrectable_sessions = 2;
}

message AvailableLayoutInfoPayload {
  repeated LayoutInfo available_layouts = 1;
  repeated LayoutWithError layouts_with_errors = 2;
}

message RunCommandResultPayload {
  optional int32 exit_code = 1;
  bytes stdout = 2;
  bytes stderr = 3;
  repeated ContextItem context = 4;
}

message WebRequestResultPayload {
  int32 status = 1;
  repeated Header headers = 2;
  bytes body = 3;
  repeated ContextItem context = 4;
}

message WebRequestStreamChunkPayload {
  string stream_id = 1;
  bytes chunk = 2;
  // no further chunks will arrive for this stream_id
  bool done = 3;
  // set only on the final chunk, when the stream was aborted rather than completed
  optional string error = 4;
}

message ContextItem {
  string name = 1;
  string value = 2;
}

message Header {
  string name = 1;
  string value = 2;
}

message PermissionRequestResultPayload {
  bool granted = 1;
}

message FileListPayload {
  repeated string paths = 1;
  repeated FileMetadata paths_metadata = 2;
}

message FileMetadata {
  bool metadata_is_set = 1; // if this is false, the metadata for this file has not been read
  bool is_dir = 2;
  bool is_file = 3;
  bool is_symlink = 4;
  uint64 len = 5;
}

message CustomMessagePayload {
  string message_name = 1;
  string payload = 2;
}

enum CopyDestination {
  Command = 0;
  Primary = 1;
  System = 2;
}

message MouseEventPayload {
  MouseEventName mouse_event_name = 1;
  oneof mouse_event_payload {
    uint32 line_count = 2;
    action.Position position = 3;
  }
}

enum MouseEventName {
    MouseScrollUp = 0;
    MouseScrollDown = 1;
    MouseLeftClick = 2;
    MouseRightClick = 3;
    MouseHold = 4;
    MouseRelease = 5;
    MouseHover = 6;
    MouseScrollLeft = 7;
    MouseScrollRight = 8;
}

message TabUpdatePayload {
    repeated TabInfo tab_info = 1;
}

message PaneUpdatePayload {
  repeated PaneManifest pane_manifest = 1;
  reserved 2;
}

message PaneManifest {
  uint32 tab_index = 1;
  repeated PaneInfo panes = 2;
}

message SessionManifest {
  reserved 8, 9, 13, 14;
  string name = 1;
  repeated TabInfo tabs = 2;
  repeated PaneManifest panes = 3;
  uint32 connected_clients = 4;
  bool is_current_session = 5;
  repeated LayoutInfo available_layouts = 6;
  repeated PluginInfo plugins = 7;
  repeated ClientTabHistory tab_history = 10;
  repeated ClientPaneHistory pane_history = 11;
  uint64 creation_time = 12;
  reserved 15, 16;
  reserved "mother", "mother_supervision";
}

message ClientTabHistory {
  uint32 client_id = 1;
  repeated uint32 tab_history = 2;
}

message ClientPaneHistory {
  uint32 client_id = 1;
  repeated PaneId pane_history = 2;
}

message PluginInfo {
  uint32 plugin_id = 1;
  string plugin_url = 2;
  repeated ContextItem plugin_config = 3;
}

message LayoutInfo {
  string name = 1;
  string source = 2;
  optional LayoutMetadata layout_metadata = 5;
}

message LayoutWithError {
  string layout_name = 1;
  LayoutParsingError error = 2;
}

message LayoutParsingError {
  oneof error_type {
    KdlErrorVariant kdl_error = 1;
    SyntaxError syntax_error = 2;
  }
}

message KdlErrorVariant {
  KdlError kdl_error = 1;
  string file_name = 2;
  string source_code = 3;
}

message SyntaxError {
  // Empty message, just a marker
}

message KdlError {
  string error_message = 1;
  optional uint64 offset = 2;
  optional uint64 len = 3;
  optional string help_message = 4;
}

message LayoutMetadata {
  repeated TabMetadata tabs = 1;
  string creation_time = 2;
  string update_time = 3;

}

message TabMetadata {
  repeated PaneMetadata pane_metadata = 1;
  optional string name = 2;
}

message PaneMetadata {
  optional string name = 1;
  bool is_plugin = 2;
  bool is_builtin_plugin = 3;
}

message ResurrectableSession {
  string name = 1;
  uint64 creation_time = 2;
}

message PaneInfo {
    uint32 id = 1;
    bool is_plugin = 2;
    bool is_focused = 3;
    bool is_fullscreen = 4;
    bool is_floating = 5;
    bool is_suppressed = 6;
    string title = 7;
    bool exited = 8;
    optional int32 exit_status = 9;
    bool is_held = 10;
    uint32 pane_x = 11;
    uint32 pane_content_x = 12;
    uint32 pane_y = 13;
    uint32 pane_content_y = 14;
    uint32 pane_rows = 15;
    uint32 pane_content_rows = 16;
    uint32 pane_columns = 17;
    uint32 pane_content_columns = 18;
    optional action.Position cursor_coordinates_in_pane = 19;
    optional string terminal_command = 20;
    optional string plugin_url = 21;
    bool is_selectable = 22;
    repeated IndexInPaneGroup index_in_pane_group = 23;
    optional string default_fg = 24;
    optional string default_bg = 25;
    reserved 26, 27;
    optional string cwd = 28;
    optional string host = 29;   // the machine the pane runs on, unset for local panes
    optional AgentInfo agent = 30;
    // Flat spelling of `target`, kept for plugins built before `PaneTarget`.
    optional command.PaneTarget target = 33;
    bool is_stack_list_member = 34;
    optional string restart_error = 35;
    optional MultipaneInfo multipane = 36;
    optional string pane_tabs_json = 37;
    optional string display_title = 38;
}

message AgentInfo {
    string kind = 1;
    AgentState state = 2;
    AgentSource source = 3;
    optional string detail = 4;
    optional string cwd = 5;
    optional string session_id = 6;
    optional string waiting_on = 7;
    optional string run_id = 8;
    bool wait_needs_a_person = 9;
}

enum AgentState {
    Busy = 0;
    Waiting = 1;
    Idle = 2;
    Exited = 3;
}

enum AgentSource {
    Spawned = 0;
    Reported = 1;
    Registered = 2;
    Detected = 3;
}

message IndexInPaneGroup {
  uint32 client_id = 1;
  uint32 index = 2;
}

message TabInfo {
    action.TabGroup group = 23;
    uint32 position = 1;
    string name = 2;
    bool active = 3;
    uint32 panes_to_hide = 4;
    bool is_fullscreen_active = 5;
    bool is_sync_panes_active = 6;
    bool are_floating_panes_visible = 7;
    repeated uint32 other_focused_clients = 8;
    optional string active_swap_layout_name = 9;
    bool is_swap_layout_dirty = 10;
    uint32 viewport_rows = 11;
    uint32 viewport_columns = 12;
    uint32 display_area_rows = 13;
    uint32 display_area_columns = 14;
    uint32 selectable_tiled_panes_count = 15;
    uint32 selectable_floating_panes_count = 16;
    uint32 tab_id = 17;
    bool has_bell_notification = 18;
    bool is_flashing_bell = 19;
    reserved 20, 21;
    // Parallel to other_focused_clients: each client's multiplayer color slot, 1 to 10, or 0
    // for none.
    repeated uint32 other_focused_client_slots = 22;
}

message ModeUpdatePayload {
  reserved 9, 10, 12, 13, 14, 15;
  input_mode.InputMode current_mode = 1;
  repeated InputModeKeybinds keybinds = 2;
  style.Style style = 3;
  bool arrow_fonts_support = 4;
  optional string session_name = 5;
  optional input_mode.InputMode base_mode = 6;
  optional string editor = 7;
  optional string shell = 8;
  optional bool currently_marking_pane_group = 11;
  optional PaneFrameStyle pane_frame_style = 16;
  optional bool session_dimmed = 17;
  repeated string ancestry = 18;
  optional bool host_fullscreen = 19;
  repeated string nested_ascend_keys = 20;
  optional bool session_ascended = 21;
  repeated string nested_descend_keys = 22;
  bool kitty_graphics_support = 23;
}

enum PaneFrameStyle {
    Full = 0;
    Titles = 1;
    None = 2;
}

message InputModeKeybinds {
  input_mode.InputMode mode = 1;
  repeated KeyBind key_bind = 2;
}

message KeyBind {
  key.Key key = 1;
  repeated action.Action action = 2;
}

message PaneRenderReportPayload {
  repeated PaneContentsEntry pane_contents = 1;
}

message PaneContentsEntry {
  PaneId pane_id = 1;
  PaneContents pane_contents = 2;
}

message PaneContents {
  repeated string viewport = 1;
  optional SelectedText selected_text = 2;
  repeated string lines_above_viewport = 3;
  repeated string lines_below_viewport = 4;
  optional action.Position cursor = 5;
  optional uint64 last_output_ms_ago = 6;
  bool is_scrolled = 7;
}

message PaneScrollbackResponse {
  oneof response {
    PaneContents ok = 1;
    string err = 2;
  }
}

message SelectedText {
  action.Position start = 1;
  action.Position end = 2;
}

message UserActionPayload {
  action.Action action = 1;
  uint32 client_id = 2;
  optional uint32 terminal_id = 3;
  optional uint32 cli_client_id = 4;
}

message ActionCompletePayload {
  action.Action action = 1;
  optional PaneId pane_id = 2;
  repeated ContextItem context = 3;
}

message PluginConfigurationChangedPayload {
  repeated ContextItem configuration = 1;
}

message HighlightClickedPayload {
  PaneId pane_id = 1;
  string pattern = 2;
  string matched_string = 3;
  repeated ContextItem context = 4;
}

// Note the absence of actions: they stay on the server. See `data::ContextMenuItem`.
message ContextMenuItem {
  string label = 1;
  optional string shortcut = 2;
  optional uint64 id = 3;
  repeated ContextItem context = 4;
  bool disabled = 5;
  bool separator = 6;
}

message ContextMenuLink {
  uint32 plugin_id = 1;
  string pattern = 2;
  string matched = 3;
  repeated ContextItem context = 4;
}

message ContextMenuContext {
  uint64 request_id = 1;
  uint32 client_id = 2;
  PaneId pane_id = 3;
  uint32 tab_position = 4;
  uint32 click_x = 5;
  uint32 click_y = 6;
  uint32 click_in_pane_x = 7;
  uint32 click_in_pane_y = 8;
  bool on_frame = 9;
  string pane_title = 10;
  optional string pane_command = 11;
  bool pane_exited = 12;
  optional int32 pane_exit_status = 13;
  bool pane_is_held = 14;
  bool pane_is_floating = 15;
  optional string selected_text = 16;
  optional string word_under_cursor = 17;
  optional string line_under_cursor = 18;
  optional ContextMenuLink link = 19;
  repeated ContextMenuItem items = 20;
}

message ContextMenuRequestedPayload {
  ContextMenuContext context = 1;
}

message ContextMenuItemSelectedPayload {
  string label = 1;
  repeated ContextItem item_context = 2;
  ContextMenuContext context = 3;
}

message InitialKeybindsPayload {
  repeated InputModeKeybinds keybinds = 1;
}

message MultipaneInfo {
    uint64 id = 1;
    repeated PaneId children = 2;
    uint64 x = 3;
    uint64 y = 4;
    uint64 rows = 5;
    uint64 columns = 6;
    bool top_bottom = 7;
    uint32 ratio = 8;
}

message CellPixelSize {
  uint32 width = 1;
  uint32 height = 2;
}

message CellPixelSizeChangedPayload {
  optional CellPixelSize size = 1;
}
