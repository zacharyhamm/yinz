syntax = "proto3";

package api.plugin_ids;

message PluginIds {
  int32 plugin_id = 1;
  int32 yinz_pid = 2;
  string initial_cwd = 3;
  uint32 client_id = 4;
  string hostname = 5;
  string host_id = 6;
  optional uint32 max_session_name_bytes = 7;
}

message YinzVersion {
  string version = 1;
}
