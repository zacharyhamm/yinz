[package]
name = "yinz-project-config"
description = "Agent-exit settings read from .yinz/agent-exit.kdl"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
yinz-types = { workspace = true }
yinz-runtime = { workspace = true }
kdl = { workspace = true }
serde = { workspace = true }

# Only the host-side readers and writers touch the filesystem; `parse` and the types also build
# for the wasm plugins through yinz-tile.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
libc = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
fuser = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
yinz-test-support = { path = "../yinz-test-support" }
