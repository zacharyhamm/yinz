[package]
name = "yinz-config"
description = "Configuration and asset loading for Yinz"
version.workspace = true
edition.workspace = true
license.workspace = true
[lints]
workspace = true
[dependencies]
yinz-types = { workspace = true }
yinz-runtime = { workspace = true }
yinz-project-config = { workspace = true }
anyhow = { workspace = true }
include_dir = { workspace = true }
kdl = { workspace = true }
log = { workspace = true }
miette = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = { version = "3.0.0", default-features = false, features = ["base-0", "tilde"] }
strum = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
url = { workspace = true }
uuid = { workspace = true }
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
[target.'cfg(not(target_family = "wasm"))'.dependencies]
notify = { workspace = true }
# The config and layout watchers use tokio::sync::mpsc.
tokio = { workspace = true, features = ["sync"] }
[dev-dependencies]
directories = { version = "6.0", default-features = false }
insta = "1.48"
expect-test = "1.4.1"
hegeltest = "0.29.3"
