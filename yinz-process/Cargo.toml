[package]
name = "yinz-process"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal process supervision and transport for Yinz"

[lints]
workspace = true

[dependencies]
yinz-ipc = { workspace = true }
interprocess = { workspace = true }
yinz-types = { workspace = true }
yinz-runtime = { workspace = true }
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }
anyhow = { workspace = true }
async-trait = { version = "0.1.50", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
highway = { version = "=1.2.0", default-features = false, features = ["std"] }
log = { workspace = true }
isahc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
toml = "0.9"
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true }
close_fds = "0.3.2"
libc = { workspace = true }
nix = { workspace = true, features = ["fs", "hostname", "poll", "process", "signal", "socket", "term", "uio", "user"] }
signal-hook = { workspace = true }
sha2 = { workspace = true }
futures-util = { workspace = true }

syntect = { version = "=5.3.0", default-features = false, features = ["parsing", "plist-load", "regex-fancy"] }
two-face = { version = "=0.5.1", default-features = false, features = ["syntect-fancy"] }

[dev-dependencies]
hegeltest = "0.29.3"
yinz-test-support = { path = "../yinz-test-support" }
