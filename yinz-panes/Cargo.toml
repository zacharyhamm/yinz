[package]
name = "yinz-panes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The yinz server's panes, pane managers, frames and layout application"

[lints]
workspace = true

[dependencies]
agent-proto = { path = "../default-plugins/agent-proto" }
yinz-tile-markdown = { path = "../yinz-tile-markdown" }
yinz-bus = { path = "../yinz-bus", version = "0.1.0" }
yinz-ipc = { workspace = true }
yinz-key-codec = { workspace = true }
yinz-runtime = { workspace = true }
yinz-types = { workspace = true }
yinz-terminal = { path = "../yinz-terminal", version = "0.1.0" }
ansi_term = { workspace = true }
kasuari = { version = "0.4.12", default-features = false }
log = { workspace = true }
nucleo-matcher = "0.3.1"
unicode-width = { workspace = true }
vte = { workspace = true }

[dev-dependencies]
yinz-config = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
interprocess = { workspace = true }
kdl = { workspace = true }
hegeltest = "0.29.3"
insta = "1.48"
png = { version = "0.17.16", default-features = false }
yinz-tile = { path = "../yinz-tile" }
