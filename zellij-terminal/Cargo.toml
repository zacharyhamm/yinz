[package]
name = "zellij-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal emulation and output serialization for Zellij"

[lints]
workspace = true

[dependencies]
zellij-ipc = { workspace = true }
zellij-runtime = { workspace = true }
zellij-types = { workspace = true }
libc = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
lazy_static = { workspace = true }
log = { workspace = true }
png = { version = "0.17.16", default-features = false }
regex = { workspace = true }
sixel-image = { version = "0.2.1", default-features = false }
sixel-tokenizer = { version = "0.1.0", default-features = false }
unicode-width = { workspace = true }
vte = { workspace = true }

[dev-dependencies]
hegeltest = "0.29.3"
insta = "1.48"
tempfile = "3.2.0"
