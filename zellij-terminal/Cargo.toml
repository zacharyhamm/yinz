[package]
name = "zellij-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal emulation and output serialization for Zellij"

[lints]
workspace = true

[dependencies]
zellij-ipc = { workspace = true }
zellij-runtime = { workspace = true }
zellij-terminal-graphics = { workspace = true }
zellij-types = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
lazy_static = { workspace = true }
log = { workspace = true }
regex = { workspace = true }
unicode-width = { workspace = true }
vte = { workspace = true }

[dev-dependencies]
# The kitty conformance fixtures that `panes::kitty_test_support` re-exports.
zellij-terminal-graphics = { workspace = true, features = ["test-support"] }
hegeltest = "0.29.3"
insta = "1.48"
tempfile = "3.2.0"
