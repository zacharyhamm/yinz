syntax = "proto3";
package client_server_contract;

import "common_types.proto";

message ClientToServerMsg {
  reserved 14, 15, 21, 26;
  oneof message {
    string session_reply_json = 37;
    string agent_control_json = 33;
    DataRequestMsg data_request = 34;
    DataRequestMsg plugin_request = 36;
    DetachSessionMsg detach_session = 1;
    TerminalPixelDimensionsMsg terminal_pixel_dimensions = 2;
    BackgroundColorMsg background_color = 3;
    ForegroundColorMsg foreground_color = 4;
    ColorRegistersMsg color_registers = 5;
    TerminalResizeMsg terminal_resize = 6;
    FirstClientConnectedMsg first_client_connected = 7;
    AttachClientMsg attach_client = 8;
    ActionMsg action = 9;
    KeyMsg key = 10;
    string paste = 35;
    ClientExitedMsg client_exited = 11;
    KillSessionMsg kill_session = 12;
    KillSessionWithCompletionMsg kill_session_with_completion = 32;
    ConnStatusMsg conn_status = 13;
    AttachWatcherClientMsg attach_watcher_client = 16;
    SubscribeToPaneRendersMsg subscribe_to_pane_renders = 17;
    DesktopNotificationResponseMsg desktop_notification_response = 18;
    ForwardedReplyFromHostMsg forwarded_reply_from_host = 19;
    HostTerminalThemeChangedMsg host_terminal_theme_changed = 20;
    NestedSessionFrameFromHostMsg nested_session_frame_from_host = 22;
    KittyGraphicsSupportMsg kitty_graphics_support = 23;
    SubscribeToEventsMsg subscribe_to_events = 28;
    SixelSupportMsg sixel_support = 24;
    RequestSessionListMsg request_session_list = 25;
    HostTerminalFocusChangedMsg host_terminal_focus_changed = 27;
    AgentReportMsg agent_report = 29;
    ModifiersHeldMsg modifiers_held = 30;
    SynchronizedOutputSupportMsg synchronized_output_support = 31;
  }
}

message DetachSessionMsg {
  repeated uint32 client_ids = 1;
}

message TerminalPixelDimensionsMsg {
  PixelDimensions pixel_dimensions = 1;
}

message BackgroundColorMsg {
  string color = 1;
}

message ForegroundColorMsg {
  string color = 1;
}

message ColorRegistersMsg {
  repeated ColorRegister color_registers = 1;
}

message TerminalResizeMsg {
  Size new_size = 1;
}

message FirstClientConnectedMsg {
  reserved 2;
  CliAssets cli_assets = 1;
}

message AttachClientMsg {
  reserved 4;
  CliAssets cli_assets = 1;
  optional uint32 tab_number_to_focus = 2;
  optional PaneReference pane_to_focus = 3;
}

message AttachWatcherClientMsg {
  reserved 2;
  Size terminal_size = 1;
}

message ActionMsg {
  Action action = 1;
  optional uint32 terminal_id = 2;
  optional uint32 client_id = 3;
  bool is_cli_client = 4;
}

message KeyMsg {
  KeyWithModifier key = 1;
  repeated uint32 raw_bytes = 2;
  bool is_kitty_keyboard_protocol = 3;
}

message ClientExitedMsg {
  // Empty message
}

message KillSessionMsg {
  // Empty message
}

message KillSessionWithCompletionMsg { bool report_progress = 1; }

message ConnStatusMsg {
  // Empty message (just indicates connection status request)
}

message SubscribeToPaneRendersMsg {
  repeated PaneId pane_ids = 1;
  optional uint32 scrollback = 2;
  bool ansi = 3;
}

message SubscribeToEventsMsg {
  repeated string event_types = 1;
  repeated string panes = 2;
  repeated string projects = 3;
  repeated string kinds = 4;
  repeated string lifecycle_types = 5;
  optional string cursor = 6;
}

message DesktopNotificationResponseMsg {
  bytes raw_bytes = 1;
}

message ForwardedReplyFromHostMsg {
  uint32 token = 1;
  bytes reply_bytes = 2;
}

message HostTerminalThemeChangedMsg {
  HostTerminalThemeIndication mode = 1;
}

enum HostTerminalThemeIndication {
  HOST_TERMINAL_THEME_INDICATION_DARK = 0;
  HOST_TERMINAL_THEME_INDICATION_LIGHT = 1;
}

message NestedSessionFrameFromHostMsg {
  bytes payload_bytes = 1;
}

message KittyGraphicsSupportMsg {
  bool supported = 1;
}

message SixelSupportMsg {
  bool supported = 1;
}

message SynchronizedOutputSupportMsg {
  bool supported = 1;
}

message RequestSessionListMsg {
  // Empty message
}

message HostTerminalFocusChangedMsg {
  bool focused = 1;
}

// A complete report. Acceptance transfers ownership to the in-memory screen queue.
message AgentReportMsg {
  string report_id = 1;
  PaneId pane_id = 2;
  // 0 unchanged, 1 clear, 2 set (requires agent).
  uint32 state = 3;
  optional AgentInfo agent = 4;
  optional AgentEventAction event = 5;
  bool trace = 6;
  uint32 process_id = 7;
  string kind = 8;
}

// Which modifier keys the host terminal says are physically down. Only sent by a client whose
// terminal was asked to report the modifier keys themselves; the set is complete each time.
message ModifiersHeldMsg {
  repeated KeyModifier modifiers = 1;
}

message DataRequestMsg {
  string request_id = 1;
  string request_json = 2;
}
