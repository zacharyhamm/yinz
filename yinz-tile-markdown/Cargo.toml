[package]
name = "yinz-tile-markdown"
version.workspace = true
edition.workspace = true
description = "CommonMark to styled terminal lines, for Yinz plugins"
license.workspace = true


[lints]
workspace = true

[dependencies]
# Split out of `yinz-tile` so the builtin plugins that draw no prose do not link a CommonMark
# parser. A default-off feature on `yinz-tile` could not do this: `xtask` builds every plugin in
# one cargo invocation, which unifies features across all of them.
yinz-tile = { path = "../yinz-tile" }
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-width = { workspace = true }
