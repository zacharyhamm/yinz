[package]
name = "zellij-tile-markdown"
version.workspace = true
edition.workspace = true
description = "CommonMark to styled terminal lines, for Zellij plugins"
license.workspace = true


[lints]
workspace = true

[dependencies]
# Split out of `zellij-tile` so the builtin plugins that draw no prose do not link a CommonMark
# parser. A default-off feature on `zellij-tile` could not do this: `xtask` builds every plugin in
# one cargo invocation, which unifies features across all of them.
zellij-tile = { path = "../zellij-tile" }
pulldown-cmark = { version = "0.13.4", default-features = false }
unicode-width = { workspace = true }
