[package]
name = "yinz"
authors = ["Zachary Hamm <hamm.zachary@gmail.com>"]
description = "An agentic development environment and terminal multiplexer"
include = ["src/**/*", "assets/layouts/*", "assets/config/*", "assets/skills/**", "LICENSE.md", "README.md", "!**/*_test.*", "!**/tests/**/*"]
# See 'workspace.package' for concrete values
license.workspace = true
repository.workspace = true
edition.workspace = true
version.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html


[lints]
workspace = true

[dependencies]
signal-hook = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }
yinz-cli = { workspace = true }
yinz-config = { workspace = true }
yinz-plugin-api = { workspace = true }
yinz-ipc = { workspace = true }
yinz-session = { workspace = true }
yinz-types = { workspace = true }
yinz-runtime = { workspace = true }
yinz-storage = { workspace = true }
yinz-process = { path = "yinz-process", version = "0.1.0" }
yinz-codex = { workspace = true }
yinz-muse = { workspace = true }
tokio = { workspace = true }
yinz-client = { path = "yinz-client/", version = "0.1.0" }
yinz-server = { path = "yinz-server/", version = "0.1.0" }
yinz-server-os = { path = "yinz-server-os", version = "0.1.0" }
anyhow = { workspace = true }
clap = { workspace = true }
console = { workspace = true }
dialoguer = { workspace = true }
interprocess = { workspace = true }
log = { workspace = true }
miette = { workspace = true }
names = { workspace = true }
nix = { workspace = true, features = ["poll", "term"] }
serde = { workspace = true }
serde_json = { workspace = true }
suggest = { workspace = true }
thiserror = { workspace = true }
tempfile = { workspace = true }
# Static libcurl and OpenSSL for the isahc clients in yinz-bus, enabled by
# `vendored_curl`. Nothing here uses them directly.
openssl-sys = { workspace = true, optional = true }
curl-sys = { workspace = true, optional = true }
# Only the `#[ignore]`d e2e suite uses this, and it drags in libssh2 + OpenSSL. Cargo does not
# allow optional dev-dependencies, so it is an optional normal dependency instead, enabled by
# the `e2e` feature that also compiles the module using it.
ssh2 = { version = "0.9.1", optional = true }

[[test]]
name = "agent_report"
path = "src/tests/agent_report.rs"

[dev-dependencies]
base64 = { version = "0.22", default-features = false, features = ["std"] }
insta = "1.48"
yinz-test-support = { path = "yinz-test-support" }
rand = { workspace = true }
regex = { workspace = true }
vte = { workspace = true }
# The agent_report test starts reporters in their own session and finds the socket directory by uid.
nix = { workspace = true, features = ["process", "user"] }

[workspace]
members = [
    "default-plugins/compact-bar",
    "default-plugins/status-bar",
    "default-plugins/strider",
    "default-plugins/tab-bar",
    "default-plugins/fixture-plugin-for-tests",
    "default-plugins/session-manager",
    "default-plugins/configuration",
    "default-plugins/plugin-manager",
    "default-plugins/multiple-select",
    "default-plugins/layout-manager",
    "default-plugins/link",
    "default-plugins/file-finder",
    "default-plugins/quit-confirmation",
    "default-plugins/shared-test",
    "default-plugins/agents",
    "default-plugins/todos",
    "default-plugins/new-agent",
    "default-plugins/agent-proto",
    "default-plugins/project-data",
    "default-plugins/agent-service",
    "default-plugins/project-store",
    "yinz-client",
    "yinz-integration-tests",
    "yinz-bus",
    "yinz-server-os",
    "yinz-routing",
    "yinz-panes",
    "yinz-tab",
    "yinz-plugin-host",
    "yinz-plugin-authoring",
    "yinz-process",
    "yinz-codex",
    "yinz-muse",
    "yinz-terminal",
    "yinz-terminal-graphics",
    "yinz-screen",
    "yinz-pty",
    "yinz-server",
    "yinz-config",
    "yinz-project-config",
    "yinz-deno-builtins",
    "yinz-plugin-api",
    "yinz-ipc",
    "yinz-session",
    "yinz-cli",
    "yinz-storage",
    "yinz-types",
    "yinz-runtime",
    "yinz-plugin-location",
    "yinz-key-codec",
    "yinz-host-protocol",
    "yinz-tile",
    "yinz-tile-markdown",
    "yinz-tile-utils",
    "yinz-test-support",
    "xtask",
    ".",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/zacharyhamm/yinz"
version = "0.1.0"
# NOTE: When updating this, modify `channel` in `rust-toolchain.toml` accordingly
rust-version = "1.97"

[workspace.lints.clippy]
# The gate is `-D warnings` (see `cargo x lint`), so everything not named here must be fixed
# rather than tolerated. Each entry below is a standing decision with a reason, and the list is
# the ratchet: removing an entry is a self-contained piece of work, and adding one should be
# argued for. Prefer `#[expect(lint, reason = "...")]` on the one item over a new entry here.
# File-level `#![allow]`s are refused by `cargo x lint` unless `FILE_LEVEL_ALLOWS` in
# `xtask/src/lint.rs` names them with a reason.

# The wide instruction enums - `ScreenInstruction`, `PluginCommand`, `Action` - carry their
# payloads by value because those payloads are the wire format. Boxing the large variants would
# put an allocation on every message through the server's hot channels.
large_enum_variant = "allow"

# `Tab::new`, `route_action` and a handful of their neighbours thread session state through by
# hand. The fix is parameter structs, which is a refactor of the call graph rather than a lint
# fix.
too_many_arguments = "allow"

# `ConfigError` carries the KDL span of what went wrong and the plugin host's errors carry the
# `PluginCommand` they failed on, so the `Result`s that return them are wide - by the same
# decision as `large_enum_variant` above, and for the same reason: the payload is the
# diagnostic. Boxing every error to satisfy the lint would buy a smaller `Result` on paths
# that are cold by definition.
result_large_err = "allow"

[workspace.dependencies]
yinz-cli = { path = "yinz-cli", version = "0.1.0" }
yinz-session = { path = "yinz-session", version = "0.1.0" }
yinz-ipc = { path = "yinz-ipc", version = "0.1.0" }
yinz-plugin-api = { path = "yinz-plugin-api", version = "0.1.0" }
yinz-plugin-authoring = { path = "yinz-plugin-authoring", version = "0.1.0" }
yinz-config = { path = "yinz-config", version = "0.1.0" }
yinz-project-config = { path = "yinz-project-config", version = "0.1.0" }
yinz-deno-builtins = { path = "yinz-deno-builtins", version = "0.1.0" }
yinz-storage = { path = "yinz-storage", version = "0.1.0" }
yinz-types = { path = "yinz-types", version = "0.1.0" }
yinz-runtime = { path = "yinz-runtime", version = "0.1.0" }
yinz-plugin-location = { path = "yinz-plugin-location", version = "0.1.0" }
yinz-key-codec = { path = "yinz-key-codec", version = "0.1.0" }
yinz-host-protocol = { path = "yinz-host-protocol", version = "0.1.0" }
yinz-codex = { path = "yinz-codex", version = "0.1.0" }
yinz-muse = { path = "yinz-muse", version = "0.1.0" }
yinz-terminal-graphics = { path = "yinz-terminal-graphics", version = "0.1.0" }
ansi_term = { version = "0.12.1", default-features = false }
anyhow = { version = "1.0.70", default-features = false, features = ["backtrace", "std"] }
async-trait = { version = "0.1", default-features = false }
chrono = { version = "0.4.19", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6", default-features = false, features = ["std", "color", "help", "usage", "error-context", "suggestions", "wrap_help", "derive", "env"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
# The version dialoguer 0.11 already builds; the session picker reads keys with it.
console = { version = "0.15", default-features = false }
crossterm = { version = "0.29", default-features = false }
daemonize = { package = "daemonix", version = "0.1", default-features = false }
dialoguer = { version = "0.11", default-features = false, features = ["password", "completion"] }
futures-lite = { version = "1.13", default-features = false, features = ["std"] }
fuzzy-matcher = { version = "0.3.7", default-features = false }
humantime = { version = "2.1.0", default-features = false }
interprocess = { version = "2.2", default-features = false, features = ["tokio"] }
isahc = { version = "1.7.2", default-features = false, features = ["http2", "text-decoding"] }
# The static libcurl and OpenSSL that the root package's `vendored_curl` feature links into isahc.
openssl-sys = { version = "0.9.93", default-features = false, features = ["vendored"] }
curl-sys = { version = "0.4", default-features = false, features = ["force-system-lib-on-osx", "ssl"] }
kdl = { version = "4.5.0", default-features = false, features = ["span"] }
lazy_static = { version = "1.4.0", default-features = false }
libc = { version = "0.2", default-features = false, features = ["std"] }
log = { version = "0.4.17", default-features = false }
memchr = { version = "2.7.6", default-features = false, features = ["std"] }
miette = { version = "7.6", default-features = false, features = ["derive", "fancy"] }
# `ioctl` for every member, although only yinz-server-os uses it. That crate is in the yinz
# binary's graph but not in the whole-app suite's, and a nix feature only one graph asks for
# makes `x integration-test` build nix and every crate above it twice.
nix = { version = "0.30", default-features = false, features = ["ioctl"] }
notify-debouncer-full = { version = "0.5", default-features = false }
notify = { version = "8.2", default-features = false, features = ["macos_kqueue"] }
num_cpus = { version = "1.16", default-features = false }
pretty-bytes = { version = "0.2.2", default-features = false }
prost = { version = "0.12.6", default-features = false, features = ["std", "prost-derive"] }
rand = { version = "0.10.2", default-features = false, features = ["std", "std_rng", "thread_rng"] }
regex = { version = "1.5.5", default-features = false, features = ["perf", "std", "unicode-perl"] }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
signal-hook = { version = "0.3", default-features = false, features = ["iterator"] }
strip-ansi-escapes = { version = "0.2.1", default-features = false }
strum = { version = "0.28.0", default-features = false, features = ["std"] }
strum_macros = { version = "0.28.0", default-features = false }
suggest = { version = "0.5.1", default-features = false }
tempfile = { version = "3.2.0", default-features = false }
# Not `sync`: each crate that uses `tokio::sync` names it. interprocess turns it on in nearly every
# graph, so a crate that forgets it still builds until that changes.
tokio = { version = "1.40", default-features = false, features = ["fs", "rt-multi-thread", "macros", "time", "process", "signal", "io-util", "io-std", "net"] }
thiserror = { version = "2.0.18", default-features = false, features = ["std"] }
tokio-util = { version = "0.7.15" }
unicode-width = { version = "0.2.2", default-features = false }
url = { version = "2.2.2", default-features = false, features = ["serde"] }
uuid = { version = "1.4.1", default-features = false, features = ["serde", "v4", "std"] }
vte = { version = "0.15", default-features = false, features = ["std"] }
names = { version = "0.14.0", default-features = false }
include_dir = { version = "0.7.3", default-features = false }
# Match the digest features enabled by the Codex WebSocket client in both build graphs.
sha2 = "0.11"

[profile.dev]
debug = "line-tables-only"

# Dependencies are optimized; workspace crates are not. `package."*"` deliberately excludes
# workspace members, so our own code keeps opt-level 0 and stays debuggable while the ~340
# third-party crates - `wasmi`, which every plugin test runs a plugin on, above all - are fast.
# One profile for `x build`, `x run`, `x test` and `x integration-test`, so they share one
# dependency build instead of maintaining a `debug/` and a `dev-opt/` tree apiece.
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
lto = true
strip = true
codegen-units = 1

# `cargo bench` inherits `release` by default, whose `lto = true` + `codegen-units = 1` make
# every bench build painfully slow for no measurement benefit. Keep the optimizations, drop the
# whole-program link step, and keep line tables so profilers can attribute samples.
[profile.bench]
inherits = "release"
lto = false
strip = false
codegen-units = 16
debug = "line-tables-only"

[package.metadata.deb]
depends = "$auto"
license-file = ["LICENSE.md", "4"]
assets = [
  ["target/release/yinz", "usr/bin/yinz", "755"],
  ["README.md", "usr/share/doc/yinz/README.md", "644"],
]

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[features]
default = ["vendored_curl"]
vendored_curl = ["dep:openssl-sys", "dep:curl-sys", "curl-sys/static-curl"]
unstable = ["yinz-client/unstable"]
# The dockerized end-to-end suite. Off by default so an ordinary `cargo test` does not build
# libssh2 and OpenSSL for five `#[ignore]`d tests; `cargo x ci e2e` turns it on.
e2e = ["dep:ssh2"]

[[test]]
name = "notes_todos"
path = "src/tests/notes_todos.rs"

[[test]]
name = "portable_cli"
path = "src/unit/portable_cli.rs"

[[test]]
name = "session_recreation"
path = "src/unit/session_recreation.rs"
