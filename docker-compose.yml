---
services:
  zellij-e2e:
    build:
      context: ./docker
      dockerfile: e2e-sshd.Dockerfile
    container_name: zellij-e2e
    hostname: zellij-e2e
    volumes:
      - type: bind
        source: ./target
        target: /usr/src/zellij
      - type: bind
        source: ./src/tests/fixtures
        target: /usr/src/zellij/fixtures
    ports:
      - "127.0.0.1:2222:2222/tcp"
    restart: unless-stopped
