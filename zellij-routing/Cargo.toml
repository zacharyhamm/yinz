[package]
name = "zellij-routing"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Synchronous action dispatch over the zellij thread bus"

[lints]
workspace = true

[dependencies]
zellij-bus = { path = "../zellij-bus", version = "0.45.0" }
zellij-types = { workspace = true }
zellij-runtime = { workspace = true }
zellij-ipc = { workspace = true }
crossbeam = { version = "0.8", default-features = false, features = ["crossbeam-channel", "std"] }
log = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true }
