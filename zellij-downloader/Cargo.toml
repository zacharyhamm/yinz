[package]
name = "zellij-downloader"
description = "HTTP downloads of plugins and layouts for Zellij"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
isahc = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tokio-stream = { version = "0.1" }
tokio-util = { version = "0.7", default-features = false, features = ["compat", "io"] }
url = { workspace = true }
openssl-sys = { version = "0.9.93", default-features = false, features = ["vendored"], optional = true }
curl-sys = { version = "0.4", default-features = false, features = ["force-system-lib-on-osx", "ssl"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# On by default so that building or testing this crate alone links the libcurl the binary ships.
# Against a system libcurl 8.5.0, a body delimited by the connection closing was seen to end
# early, which the layout size-limit test catches. Workspace members depend on this crate with
# default features off, and the root package's `vendored_curl` feature turns this one on.
default = ["vendored_curl"]
vendored_curl = ["isahc/static-curl", "dep:openssl-sys", "dep:curl-sys"]
