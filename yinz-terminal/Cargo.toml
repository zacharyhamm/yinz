[package]
name = "yinz-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal emulation and output serialization for Yinz"

[lints]
workspace = true

[dependencies]
yinz-host-protocol = { workspace = true }
yinz-runtime = { workspace = true }
yinz-terminal-graphics = { workspace = true }
yinz-types = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["std"] }
lazy_static = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true, features = ["unicode-bool"] }
unicode-width = { workspace = true }
vte = { workspace = true }

[dev-dependencies]
hegeltest = "0.29.3"
insta = "1.48"
tempfile = "3.2.0"
