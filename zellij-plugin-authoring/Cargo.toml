[package]
name = "zellij-plugin-authoring"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline TypeScript plugin checks and writes, run through the compilation worker"

[features]
# The worker spawn counter that `zellij-plugin-host`'s loader and plugin tests assert deltas
# against. Its normal dependency enables this feature for consistent build and test selection.
test-support = []

[lints]
workspace = true

[dependencies]
zellij-config = { workspace = true }
zellij-plugin-api = { workspace = true }
zellij-runtime = { workspace = true }
zellij-types = { workspace = true }
anyhow = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
