[package]
name = "zellij-process"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Terminal process supervision and transport for Zellij"

[lints]
workspace = true

[dependencies]
zellij-ipc = { workspace = true }
zellij-types = { workspace = true }
zellij-runtime = { workspace = true }
sysinfo = { version = "0.39.5", default-features = false, features = ["system"] }
anyhow = { workspace = true }
async-trait = { version = "0.1.50", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["std"] }
highway = { version = "=1.2.0", default-features = false, features = ["std"] }
log = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
uuid = { workspace = true }
close_fds = "0.3.2"
libc = { workspace = true }
nix = { workspace = true, features = ["fs", "hostname", "poll", "process", "signal", "socket", "term", "uio", "user"] }
signal-hook = { workspace = true }
sha2 = { workspace = true }
futures-util = { version = "0.3" }

[dev-dependencies]
hegeltest = "0.29.3"
tempfile = { workspace = true }
zellij-test-support = { path = "../zellij-test-support" }
